<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2350d8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="victreina">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<script src="firebase-config.js"></script>
</head>
<body>
<!--APP-->
<title>victreina</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: one-column phone app; content scrolls above a fixed bottom tab bar, input happens in bottom sheets. Each muscle group owns a color. */
:root{
  --bg:#eceff3; --surface:#ffffff; --fg:#14171c; --muted:#5b6370; --line:#d6dbe2;
  --accent:#2350d8; --accent-ink:#ffffff; --accent-soft:#e1e8fb;
  --ok:#1b7f45; --ok-soft:#dcf1e4; --danger:#c22f2a; --shadow:0 10px 30px rgba(20,23,28,.18);
  --g-peito:#c8323f; --g-costas:#2474d6; --g-ombros:#c98f00; --g-biceps:#5b4fd6; --g-triceps:#a63bc4;
  --g-quad:#12937a; --g-post:#5f861a; --g-gluteos:#dc4f8b; --g-pant:#0a8aa3; --g-abd:#8a5a33;
  --g-cardio:#e0632a; --g-along:#3b9d4e;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1014; --surface:#181b21; --fg:#eef0f4; --muted:#98a0ad; --line:#2a2f38;
  --accent:#7393ff; --accent-ink:#0b0e14; --accent-soft:#1d2540;
  --ok:#50c683; --ok-soft:#15301f; --danger:#ff6f67; --shadow:0 10px 30px rgba(0,0,0,.5);
  --g-peito:#ff6b78; --g-costas:#5ea2ff; --g-ombros:#f2c14e; --g-biceps:#9a90ff; --g-triceps:#d57ef0;
  --g-quad:#3fd1ae; --g-post:#a2cf5a; --g-gluteos:#ff85b6; --g-pant:#45c9e2; --g-abd:#cf9a6c;
  --g-cardio:#ff9160; --g-along:#6fd184;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1014; --surface:#181b21; --fg:#eef0f4; --muted:#98a0ad; --line:#2a2f38;
  --accent:#7393ff; --accent-ink:#0b0e14; --accent-soft:#1d2540;
  --ok:#50c683; --ok-soft:#15301f; --danger:#ff6f67; --shadow:0 10px 30px rgba(0,0,0,.5);
  --g-peito:#ff6b78; --g-costas:#5ea2ff; --g-ombros:#f2c14e; --g-biceps:#9a90ff; --g-triceps:#d57ef0;
  --g-quad:#3fd1ae; --g-post:#a2cf5a; --g-gluteos:#ff85b6; --g-pant:#45c9e2; --g-abd:#cf9a6c;
  --g-cardio:#ff9160; --g-along:#6fd184;
  color-scheme:dark}

*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;touch-action:manipulation;-webkit-user-select:none;user-select:none}
html{-webkit-text-size-adjust:100%;overscroll-behavior-y:none}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
main{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:16px calc(96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:22px}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;letter-spacing:.01em;text-wrap:balance}
h1{font-size:2rem;line-height:1}
h2{font-size:1.45rem;line-height:1.05}
h3{font-size:.8rem;font-family:var(--body);font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
p{margin:0}
.eyebrow{font-size:.78rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.muted{color:var(--muted)}
.section{display:flex;flex-direction:column;gap:10px}

.datebar{display:flex;align-items:center;gap:8px}
.datebar .t{flex:1;min-width:0;text-align:center}
.iconbtn{flex:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);font-size:1.3rem}
.iconbtn:disabled{opacity:.35;cursor:default}
.checkin{width:100%;min-height:52px;border-radius:14px;border:2px dashed var(--line);font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--muted);background:transparent}
.checkin.on{border:2px solid var(--ok);background:var(--ok-soft);color:var(--ok)}

.banner{background:var(--accent-soft);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.banner p{font-size:.92rem}

.chips{display:flex;gap:8px;overflow-x:auto;margin-inline:-16px;padding-inline:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 13px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:500;white-space:nowrap;display:flex;align-items:center;gap:7px}
.chip::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--gc)}
.chip.on{background:color-mix(in srgb,var(--gc) 16%,var(--surface));border-color:var(--gc);font-weight:600}
.chip .done{font-size:.75rem;color:var(--ok);font-weight:700}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-size:.78rem;font-weight:600;padding:3px 9px;border-radius:999px;background:color-mix(in srgb,var(--gc) 16%,var(--surface));color:var(--fg);border:1px solid color-mix(in srgb,var(--gc) 45%,transparent)}

.list{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 16px 13px 14px;border-top:1px solid var(--line);min-height:64px;box-shadow:inset 4px 0 0 var(--gc,transparent)}
.row:first-child{border-top:0}
.row .main{flex:1;min-width:0;padding-left:4px}
.row .name{font-weight:600}
.row .target{font-size:.86rem;font-weight:600;color:var(--gc,var(--muted))}
.row .sub{font-size:.86rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{flex:none;font-size:.8rem;font-weight:600;padding:4px 9px;border-radius:999px;background:var(--ok-soft);color:var(--ok)}
.chev{flex:none;color:var(--muted);font-size:1.2rem}
.addrow{color:var(--accent);font-weight:600;justify-content:center;min-height:52px;box-shadow:none}

.planhead{display:flex;flex-direction:column;gap:6px}
.planhead .meta{font-size:.88rem;color:var(--muted)}
.empty{padding:20px 16px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:16px}

.summary .item{display:flex;justify-content:space-between;gap:12px;padding:12px 16px 12px 14px;border-top:1px solid var(--line);box-shadow:inset 4px 0 0 var(--gc,transparent)}
.summary .item:first-child{border-top:0}
.summary .sets{text-align:right;font-size:.92rem}

.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.stat .v{font-family:var(--display);font-size:1.9rem;font-weight:700;line-height:1}
.stat .v small{font-size:1rem;color:var(--muted);font-weight:600}
.stat .l{font-size:.82rem;color:var(--muted)}
.stat .v.up{color:var(--ok)}

.cal{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px}
.calhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.calhead h2{text-align:center}
.calhead h2::first-letter{text-transform:uppercase}
.grid7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wd{text-align:center;font-size:.75rem;font-weight:600;color:var(--muted);padding:4px 0}
.day{aspect-ratio:1;max-width:100%;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-weight:500;font-variant-numeric:tabular-nums}
.day .dots{display:flex;gap:2px;height:5px}
.day .dots i{width:5px;height:5px;border-radius:50%;background:var(--gc)}
.day.today{box-shadow:inset 0 0 0 2px var(--accent)}
.day.on{background:var(--accent-soft);color:var(--fg);font-weight:700}
.day.future{color:var(--muted);opacity:.45;cursor:default}
.day.blank{visibility:hidden}
.hint{font-size:.85rem;color:var(--muted);text-align:center;margin-top:8px}

.goal{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.mini{display:flex;align-items:center;gap:10px}
.mini button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);font-size:1.2rem}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px}
svg text{fill:var(--muted);font-family:var(--body);font-size:11px}

select,input[type=text]{width:100%;font:inherit;font-size:16px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}

.hist .item{display:flex;justify-content:space-between;gap:12px;padding:11px 16px;border-top:1px solid var(--line);font-size:.95rem}
.hist .item:first-child{border-top:0}
.pr{color:var(--ok);font-weight:600;font-size:.8rem;margin-left:6px}

/* Plan */
.wkrow .wdn{flex:none;width:40px;font-family:var(--display);font-weight:700;font-size:1.1rem;text-transform:uppercase;color:var(--muted)}
.wkrow.today .wdn{color:var(--accent)}
.wkrow .main{display:flex;flex-direction:column;gap:5px}
.wkrow .rest{color:var(--muted);font-weight:500}
.sm{flex:none;min-height:36px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:.9rem;color:var(--accent)}
.titlerow{display:flex;align-items:center;gap:12px}
.titlerow h2{flex:1;min-width:0}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:12px;background:var(--bg)}
.seg button{min-height:40px;border-radius:9px;font-weight:600;font-size:.92rem;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.row.sel{background:var(--accent-soft)}
.row .check{flex:none;color:var(--accent);font-weight:700}
.irow{display:flex;align-items:center;border-top:1px solid var(--line);box-shadow:inset 4px 0 0 var(--gc,transparent)}
.irow:first-child{border-top:0}
.irow .row{border-top:0;box-shadow:none;flex:1;min-width:0}
.mv{display:flex;flex-direction:column;padding-right:8px}
.mv button{width:34px;height:28px;border-radius:8px;color:var(--muted);font-size:.9rem}
.mv button:disabled{opacity:.25;cursor:default}
.pic{flex:none;width:52px;height:52px;border-radius:12px;background:color-mix(in srgb,var(--gc,var(--muted)) 13%,var(--surface));overflow:hidden;display:grid;place-items:center}
.pic svg{width:100%;height:100%;display:block}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.pic.lg{width:112px;height:112px;border-radius:18px}
.pic .eq{fill:none;stroke:var(--muted);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.pic .cab{fill:none;stroke:var(--muted);stroke-width:1.2;stroke-dasharray:2 2}
.pic .fig,.pic .fig2{fill:none;stroke:var(--gc,var(--fg));stroke-width:4.4;stroke-linecap:round;stroke-linejoin:round}
.pic .fig2{opacity:.5}
.pic .head{fill:var(--gc,var(--fg))}
.pic .plate{fill:var(--fg);opacity:.72}
.pic .ini{font-family:var(--display);font-weight:700;font-size:1.25rem;color:var(--gc,var(--fg))}
.pic.lg .ini{font-size:2.4rem}
.logtop{display:flex;gap:14px;align-items:flex-start}
.logtop .c{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.logtop .eyebrow{color:var(--gc)}
.phbtns{display:flex;gap:14px;flex-wrap:wrap;margin-top:4px}
.phbtns .link{text-align:left}
.exsel{display:flex;gap:12px;align-items:flex-end}
.exsel .field{flex:1;min-width:0}
.tick{flex:none;width:48px;align-self:stretch;display:grid;place-items:center}
.tick span{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:1rem;font-weight:700;color:transparent;transition:background .15s,border-color .15s}
.tick.on span{background:var(--gc);border-color:var(--gc);color:var(--surface)}
.irow.done .name{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1.5px}
.irow .row .main{padding-left:0}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:4px;transition:width .25s}
.today-log{color:var(--ok);font-weight:600}
.wtitle{font-family:var(--display);font-size:1.45rem;font-weight:700}
.timer{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 8px 8px 14px}
.timer .clock{flex:1;min-width:0;font-family:var(--display);font-weight:700;font-size:1.6rem;font-variant-numeric:tabular-nums;line-height:1}
.timer .clock small{display:block;font-family:var(--body);font-size:.75rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}
.timer .sm{min-height:44px}
.sm.solid{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.seg3{grid-template-columns:repeat(3,1fr)}
.seg4{grid-template-columns:repeat(4,1fr)}
.seg4 button{font-size:.85rem}
.dayphoto{position:relative;border-radius:16px;overflow:hidden;background:var(--surface);border:1px solid var(--line)}
.dayphoto img{display:block;width:100%;aspect-ratio:2/1;object-fit:cover}
.dayphoto .bar2{position:absolute;left:0;right:0;bottom:0;display:flex;gap:8px;justify-content:flex-end;padding:10px;background:linear-gradient(transparent,rgba(0,0,0,.55))}
.dayphoto .bar2 button{min-height:38px;padding:0 14px;border-radius:10px;background:rgba(255,255,255,.92);color:#14171c;font-weight:600;font-size:.88rem}
.addphoto{width:100%;min-height:64px;border-radius:14px;border:2px dashed var(--line);display:flex;align-items:center;justify-content:center;gap:10px;color:var(--muted);font-weight:600}
.addphoto svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.day.ph{background-size:cover;background-position:center;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.8);font-weight:700}
.day.ph .dots{display:none}
.gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.gallery button{position:relative;border-radius:12px;overflow:hidden;aspect-ratio:4/5;background:var(--line)}
.gallery img{width:100%;height:100%;object-fit:cover;display:block}
.gallery span{position:absolute;left:6px;bottom:6px;font-size:.75rem;font-weight:700;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.8)}
.viewer img{display:block;width:100%;border-radius:14px;max-height:60vh;object-fit:contain;background:#000}
.stickerbox{border-radius:16px;padding:18px;display:grid;place-items:center}
.stickerbox img{display:block;max-width:100%;max-height:34vh}

/* Tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab .av{width:24px;height:24px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 2px transparent}
.tab.on .av{box-shadow:0 0 0 2px var(--accent)}
.profhead{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding-block:8px}
.avatar{width:104px;height:104px;border-radius:50%;object-fit:cover;background:var(--accent-soft);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:2.6rem;color:var(--accent);box-shadow:0 0 0 4px var(--surface),0 0 0 6px var(--accent)}
.profhead h1{font-size:2.2rem}
.profhead .since{font-size:.88rem;color:var(--muted)}
.gbars{display:flex;flex-direction:column;gap:10px}
.gbar{display:grid;grid-template-columns:96px 1fr 34px;gap:10px;align-items:center;font-size:.9rem}
.gbar .tr{height:12px;border-radius:6px;background:var(--line);overflow:hidden}
.gbar .tr i{display:block;height:100%;border-radius:6px;background:var(--gc)}
.gbar .n{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.recs .item{display:flex;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid var(--line)}
.recs .item:first-child{border-top:0}
.recs .item .main{flex:1;min-width:0}
.recs .item .name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.recs .item .sub{font-size:.82rem;color:var(--muted)}
.recs .kg{font-family:var(--display);font-weight:700;font-size:1.4rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.recs .pic{width:44px;height:44px}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 8px;font-size:.68rem;font-weight:600;color:var(--muted)}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--accent)}

/* Sheet */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:10}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:11;background:var(--surface);border-radius:20px 20px 0 0;box-shadow:var(--shadow);max-height:90vh;overflow-y:auto;padding-inline:16px;padding-block:10px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet .in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.sheet.still{animation:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(40px);opacity:.4}}}
.sheethead{display:flex;align-items:flex-start;gap:12px}
.sheethead>div{flex:1;min-width:0}
.sheethead .eyebrow{color:var(--gc)}
.info{display:flex;gap:8px;flex-wrap:wrap}
.info span{background:var(--bg);border-radius:10px;padding:6px 10px;font-size:.88rem}
.tip{border-radius:12px;padding:10px 12px;font-size:.92rem;background:var(--ok-soft);color:var(--fg)}
.tip b{color:var(--ok)}
.note2{font-size:.88rem;color:var(--muted)}
.steppers{display:flex;flex-direction:column;gap:10px}
.stepper{display:flex;align-items:center;gap:10px}
.stepper label{flex:1;font-weight:600;min-width:0}
.stepper label small{display:block;font-weight:400;color:var(--muted);font-size:.8rem}
.stepper button{flex:none;width:48px;height:48px;border-radius:12px;background:var(--bg);font-size:1.5rem;font-weight:500}
.stepper input{flex:none;width:80px;text-align:center;font-family:var(--display);font-size:1.7rem;font-weight:700;padding:6px 4px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-variant-numeric:tabular-nums}
.primary{width:100%;min-height:52px;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:1.05rem}
.ghost{width:100%;min-height:46px;border-radius:14px;border:1px solid var(--line);font-weight:600;background:var(--surface)}
.danger{color:var(--danger)}
.danger.armed{background:var(--danger);color:var(--surface);border-color:var(--danger)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:600;font-size:.9rem}
.entries .item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.entries .item:first-child{border-top:0}
.del{width:36px;height:36px;border-radius:10px;color:var(--danger);font-size:1.1rem}

const picCache={};
function picSvg(id){
  if(picCache[id])return picCache[id];
  const P=PICS[id];if(!P)return '';
  const J={};for(const t of P.j.split(' ')){const [k,v]=t.split(':');J[k]=v}
  const L=(...ks)=>ks.every(k=>J[k])?'M'+ks.map(k=>J[k]).join('L'):'';
  const main=[L('s','p'),L('p','k','f'),L('s','e','w')].join('');
  const two=[L('p','k2','f2'),L('s','e2','w2')].join('');
  const plates=(P.o||'').split(';').filter(Boolean).map(o=>{const [x,y,r]=o.split(',');return `<circle class="plate" cx="${x}" cy="${y}" r="${r}"/>`}).join('');
  const [hx,hy]=J.h.split(',');
  return picCache[id]=`<svg viewBox="0 0 64 64" aria-hidden="true">${P.eq?`<path class="eq" d="${P.eq}"/>`:''}${P.cab?`<path class="cab" d="${P.cab}"/>`:''}${two?`<path class="${P.front?'fig':'fig2'}" d="${two}"/>`:''}<path class="fig" d="${main}"/>${plates}<circle class="head" cx="${hx}" cy="${hy}" r="4.8"/></svg>`;
}

const pad=n=>String(n).padStart(2,'0');
const keyOf=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseKey=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(k,n)=>{const d=parseKey(k);d.setDate(d.getDate()+n);return keyOf(d)};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const ddmm=k=>{const [,m,d]=k.split('-');return `${d}/${m}`};

const restTxt=m=>m>=1?`${fmt(m)} min`:`${Math.round(m*60)} s`;
function setTxt(l){
  if(l.min!=null)return `${l.min} min`;
  if(l.sec)return `${l.s} × ${l.r} s`;
  return `${l.s} × ${l.r} · ${fmt(l.w)} kg`;
}

function ensureDefaults(){
  const v=S.v||1;let ch=false;
  if(v<2){
    for(const d of Object.values(CAT)){
      const same=S.exercises.find(e=>e.id===d.id||norm(e.name)===norm(d.name));
      if(same){if(!same.kind)same.kind=d.kind}else S.exercises.push({...d});
    }
    ch=true;
  }
  if(v<3||!Array.isArray(S.workouts)){
    S.workouts=DEFAULT_WORKOUTS.map(w=>({id:w.id,t:w.t,items:w.items.map(a=>{
      let e=resolveEx(a[0]);if(!e){e={...CAT[a[0]]};S.exercises.push(e)}
      return a.length===2?{ex:e.id,mins:a[1]}:{ex:e.id,sets:a[1],rmin:a[2],rmax:a[3],rest:a[4]};
    })}));
    S.schedule={...DEFAULT_SCHEDULE};ch=true;
  }
  if(!S.schedule){S.schedule={...DEFAULT_SCHEDULE};ch=true}
  S.v=3;return ch;
}

  },()=>{}));

    if(skipCache&&q.metadata.fromCache)return;
    const ph={};for(const doc of q.docs){const d=doc.data();if(d.ex&&d.data)ph[d.ex]=d.data}
    for(const ex of Object.keys(PH)){const id='photo-'+ex;if(pending[id]||busy[id])ph[ex]=PH[ex]}

  },()=>{}));

    if(skipCache&&q.metadata.fromCache)return;
    const days={};
    for(const doc of q.docs){const d=doc.data();days[d.date]={checked:!!d.checked,logs:JSON.parse(JSON.stringify(d.logs||[]))};if(d.w)days[d.date].w=d.w;if(Array.isArray(d.done))days[d.date].done=[...d.done];for(const f of ['start','end','dur'])if(d[f]!=null)days[d.date][f]=d[f]}

}

async function shrinkPhoto(file){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((ok,err)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=err;i.src=url});
    const side=Math.min(img.naturalWidth,img.naturalHeight),size=Math.min(360,side);
    const c=document.createElement('canvas');c.width=c.height=size;
    c.getContext('2d').drawImage(img,(img.naturalWidth-side)/2,(img.naturalHeight-side)/2,side,side,0,0,size,size);
    return c.toDataURL('image/jpeg',0.72);
  }finally{URL.revokeObjectURL(url)}
}

      <line x1="0" x2="${W}" y1="${gl}" y2="${gl}" stroke="var(--ok)" stroke-dasharray="4 4" opacity=".7"/>
      ${bars}
    </svg><p class="hint" style="margin:4px 0 0">A linha tracejada é a sua meta de ${S.goal} dias. As semanas em que você bateu a meta ficam verdes.</p></div>

function niceStep(r){if(!(r>0))return 1;const e=Math.pow(10,Math.floor(Math.log10(r))),f=r/e;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*e}
function chart(pts){
  const W=340,H=190,pl=36,pr=16,pt=22,pb=26;
  let lo=Math.min(...pts.map(p=>p.w)),hi=Math.max(...pts.map(p=>p.w));
  if(hi-lo<4){lo=Math.max(0,lo-5);hi=hi+5}
  const st=niceStep((hi-lo)/3);lo=Math.floor(lo/st)*st;hi=Math.ceil(hi/st)*st;
  const x=i=>pts.length===1?(pl+W-pr)/2:pl+i*(W-pl-pr)/(pts.length-1);
  const y=v=>pt+(hi-v)/(hi-lo)*(H-pt-pb);
  let g='';for(let v=lo;v<=hi+1e-9;v+=st)g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end">${fmt(v)}</text>`;
  const line=pts.map((p,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(p.w).toFixed(1)}`).join('');
  const area=`${line}L${x(pts.length-1).toFixed(1)},${H-pb}L${x(0).toFixed(1)},${H-pb}Z`;
  const L=pts.length-1;
  const dots=pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.w)}" r="${i===L?5:3}" fill="${i===L?'var(--gc)':'var(--surface)'}" stroke="var(--gc)" stroke-width="2"/>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Carga máxima por treino">
    ${g}
    ${pts.length>1?`<path d="${area}" fill="var(--gc)" opacity=".13"/><path d="${line}" fill="none" stroke="var(--gc)" stroke-width="2.5" stroke-linejoin="round"/>`:''}
    ${dots}
    <text x="${Math.min(x(L)+(pts.length===1?0:4),W-pr)}" y="${y(pts[L].w)-10}" text-anchor="${pts.length===1?'middle':'end'}" style="fill:var(--fg);font-weight:600;font-size:12px">${fmt(pts[L].w)} kg</text>
    <text x="${x(0)}" y="${H-6}" text-anchor="${pts.length===1?'middle':'start'}">${ddmm(pts[0].k)}</text>
    ${pts.length>1?`<text x="${x(L)}" y="${H-6}" text-anchor="end">${ddmm(pts[L].k)}</text>`:''}
  </svg>`;
}

function profileStats(){
  const act=Object.keys(S.days).filter(k=>{const d=S.days[k];return d.checked||d.logs.length}).sort();
  const first=act[0]||null;
  let vol=0,mins=0,prs=0;
  for(const k of act){const d=S.days[k];for(const l of d.logs)if(l.w!=null)vol+=l.w*l.r*l.s;const m=durMin(d);if(m)mins+=m}
  // recordes: cada vez que a carga máxima de um exercício superou a anterior
  const best=[];
  for(const e of S.exercises){
    if(kindOf(e)!=='carga')continue;
    const ss=sessions(e.id);if(!ss.length)continue;
    let run=0,bk=ss[0].k;
    for(const s of ss){if(s.w>run){if(run>0)prs++;run=s.w;bk=s.k}}
    best.push({e,w:run,k:bk});
  }
  best.sort((a,b)=>b.k.localeCompare(a.k)||b.w-a.w);
  // sequência de semanas
  const ws=weekStart(today());let cur=0,w=ws;if(weekCount(w)===0)w=addDays(w,-7);
  while(weekCount(w)>0){cur++;w=addDays(w,-7)}
  let bestRun=0,run=0;
  if(first){for(let s=weekStart(first);s<=ws;s=addDays(s,7)){if(weekCount(s)>0){run++;bestRun=Math.max(bestRun,run)}else run=0}}
  // grupos mais treinados (em dias)
  const gcount={};for(const k of act)for(const g of groupsOn(k))gcount[g]=(gcount[g]||0)+1;
  const groups=Object.entries(gcount).sort((a,b)=>b[1]-a[1]).slice(0,6);
  return {first,days:checkedKeys().length,vol,mins,prs,best:best.slice(0,6),cur,bestRun,groups};
}

function viewProg(){
  const logged=S.exercises.filter(e=>kindOf(e)==='carga'&&sessions(e.id).length);
  const head=`<div class="section"><div class="eyebrow">Progressão de carga</div><h1>Sua evolução</h1></div>`;
  if(!logged.length)return head+`<div class="empty">Quando você registrar cargas na aba Hoje, a evolução de cada máquina aparece aqui em gráfico.</div>`+acct();
  if(!ui.prog||!logged.some(e=>e.id===ui.prog)){
    let best=null,bk='';for(const e of logged){const s=sessions(e.id);const k=s[s.length-1].k;if(k>bk){bk=k;best=e.id}}ui.prog=best;
  }
  const ex=exById(ui.prog),ss=sessions(ui.prog);
  const opts=GN.map(g=>{const es=logged.filter(e=>e.group===g);return es.length?`<optgroup label="${g}">${es.map(e=>`<option value="${e.id}" ${e.id===ui.prog?'selected':''}>${esc(e.name)}</option>`).join('')}</optgroup>`:''}).join('');
  const firstW=ss[0].w,lastW=ss[ss.length-1].w,best=Math.max(...ss.map(s=>s.w));
  const diff=lastW-firstW,pct=firstW?Math.round(diff/firstW*100):0;
  let run=0;const hist=ss.map(s=>{const pr=s.w>run&&run>0;run=Math.max(run,s.w);return {...s,pr}}).reverse();
  return head+`
  <div class="field"><label for="progSel">Exercício</label><select id="progSel">${opts}</select></div>
  <div class="stats">
    <div class="stat"><span class="v num">${fmt(best)}<small> kg</small></span><span class="l">Recorde</span></div>
    <div class="stat"><span class="v num">${fmt(lastW)}<small> kg</small></span><span class="l">Último treino</span></div>
    <div class="stat"><span class="v num ${diff>0?'up':''}">${diff>0?'+':''}${fmt(diff)}<small> kg</small></span><span class="l">Desde o primeiro (${fmt(firstW)} kg)</span></div>
    <div class="stat"><span class="v num ${pct>0?'up':''}">${pct>0?'+':''}${pct}<small>%</small></span><span class="l">${ss.length} ${ss.length===1?'treino registrado':'treinos registrados'}</span></div>
  </div>
  <div class="section"><h3>Carga máxima por treino</h3><div class="card" style="${gc(ex.group)}">${chart(ss)}${ss.length===1?'<p class="hint" style="margin:4px 0 0">Registre mais treinos neste exercício para ver a linha de evolução.</p>':''}</div></div>
  <div class="section"><h3>Histórico</h3><div class="list hist">${hist.map(s=>`<div class="item"><span class="num">${ddmm(s.k)}${s.pr?'<span class="pr">recorde</span>':''}</span><span class="num" style="text-align:right">${s.logs.map(setTxt).join('<br>')}</span></div>`).join('')}</div></div>
  ${acct()}`;
}

function sheetLog(exId,wid,idx){

  }else if(kind==='iso'){
    const l=last?.l;

      else{const nr=Math.max(it.rmin,l.r+1);pre={w:l.w,r:nr,s:it.sets};tip=`Meta de hoje: <b>${fmt(l.w)} kg × ${nr} repetições</b>, 1 a mais que da última vez. Quando chegar a ${it.rmax}, suba a carga.`}
    }else if(l&&l.w!=null)pre={w:l.w,r:l.r,s:l.s};

    if(todayLogs.length){const t=todayLogs.at(-1);pre={w:t.w,r:t.r,s:t.s}}
  }
  const steppers=kind==='tempo'?stepper('m','Duração','em minutos',pre.min,5)

    :stepper('w','Carga','em kg',fmt(pre.w),'w')+stepper('r','Repetições','por série',pre.r,1)+stepper('s','Séries','quantas vezes',pre.s,1);
  openSheet(`
    <div class="logtop">${pic(e,true)}<div class="c"><div class="eyebrow">${esc(e.group)}</div><h2>${esc(e.name)}</h2><div class="phbtns"><button class="link" data-act="photo" data-id="${exId}">${PH[exId]?'Trocar foto':'Usar foto da minha academia'}</button>${PH[exId]?`<button class="link" data-act="unphoto" data-id="${exId}">Voltar ao desenho</button>`:''}</div></div>${closeBtn()}</div>

    <div class="field"><label for="itGroup">Grupo</label><select id="itGroup">${GN.map(g=>`<option ${g===dr.newGroup?'selected':''}>${g}</option>`).join('')}</select></div>`:''}
    <div class="steppers">${fields}</div>
    <button class="primary" data-act="saveItem">${dr.idx<0?'Adicionar ao treino':'Salvar'}</button>
    ${dr.idx>=0?`<button class="ghost danger" data-act="delItem">Tirar deste treino</button>`:''}
    ${!isNew&&dr.idx>=0?'<p class="hint" style="margin:0">Se trocar a máquina, o histórico da anterior continua salvo no Progresso.</p>':''}`,e?gc(e.group):'');
}
function readDraft(){
  const dr=ui.draft,v=id=>document.getElementById(id);
  if(v('itEx'))dr.ex=v('itEx').value;
  if(v('itName'))dr.newName=v('itName').value;
  if(v('itGroup'))dr.newGroup=v('itGroup').value;
  if(v('itMins'))dr.mins=Math.max(1,Math.round(readNum('itMins')));
  if(v('itSets'))dr.sets=Math.max(1,Math.round(readNum('itSets')));
  if(v('itMin'))dr.rmin=Math.max(1,Math.round(readNum('itMin')));
  if(v('itMax'))dr.rmax=Math.max(1,Math.round(readNum('itMax')));
  if(v('itRest'))dr.rest=Math.max(0.5,readNum('itRest'));
}
function itemBack(){const dr=ui.draft;ui.draft=null;if(dr&&dr.ret==='workout')sheetWorkout(dr.wid);else closeSheet();render()}

let toastT;
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2800)}
const readNum=id=>{const v=parseFloat(String(document.getElementById(id).value).replace(',','.'));return isFinite(v)&&v>=0?v:0};

/* ================= Ações ================= */
document.addEventListener('click',ev=>{
  const tab=ev.target.closest('[data-tab]');
  if(tab){ui.tab=tab.dataset.tab;try{localStorage.setItem(LS+'-tab',ui.tab)}catch(e){}render();window.scrollTo(0,0);return}
  const b=ev.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act;
  if(a==='close'){if(ui.draft)return itemBack();return closeSheet()}
  if(a==='signin')return signIn();
  if(a==='signout'){fb.auth&&fb.auth.signOut();toast('Você saiu. Os dados continuam neste aparelho.');return}
  if(a==='day'){const k=addDays(ui.date,+b.dataset.n);if(k<=today()){ui.date=k;ui.group=null;render()}return}
  if(a==='check'){const d=dayOf(ui.date);d.checked=!d.checked;persistDay(ui.date);render();toast(d.checked?'Presença marcada':'Presença desmarcada');return}
  if(a==='group'){ui.group=b.dataset.g;render();return}
  if(a==='photo'){const [x,w,i]=ui.logCtx||[b.dataset.id];return pickPhoto(b.dataset.id,()=>sheetLog(x,w,i))}
  if(a==='unphoto'){const ex=b.dataset.id;delete PH[ex];persistPhoto(ex);render();const [x,w,i]=ui.logCtx||[ex];sheetLog(x,w,i);toast('Voltou ao desenho');return}
  if(a==='dpPick'){const k=b.dataset.k;return pickDayPhoto(k,()=>{if(sheetRoot.innerHTML)sheetDayPhoto(k)})}
  if(a==='dpView')return sheetDayPhoto(b.dataset.k);
  if(a==='dpDel'){
    if(!b.classList.contains('armed')){b.classList.add('armed');b.textContent='Toque de novo para apagar';return}
    const k=b.dataset.k;delete DP[k];persistDayPhoto(k);closeSheet();render();toast('Foto apagada');return;
  }
  if(a==='calToggle'){const k=b.dataset.k,d=dayOf(k);d.checked=!d.checked;persistDay(k);closeSheet();render();return}
  if(a==='nick')return sheetNick();
  if(a==='saveNick'){S.nick=document.getElementById('nickIn').value.trim().slice(0,30);persistProfile();closeSheet();render();toast('Nome salvo');return}
  if(a==='tick'){
    const k=ui.date,ex=b.dataset.id,on=!isDone(k,ex);setDone(k,ex,on);persistDay(k);render();
    if(on&&navigator.vibrate)try{navigator.vibrate(12)}catch(e){}
    const w=workoutFor(k);if(on&&w&&w.items.length&&w.items.every(it=>isDone(k,it.ex)))toast(S.days[k].start&&!S.days[k].end?'Treino completo! Toque em Finalizar para gerar a imagem.':'Treino completo! Bom trabalho.');
    return;
  }
  if(a==='log')return sheetLog(b.dataset.id,b.dataset.w,b.dataset.i);
  if(a==='newEx')return sheetEx(null);
  if(a==='editEx')return sheetEx(b.dataset.id);
  if(a==='step'){
    const id=b.dataset.t,cur=readNum(id),n=+b.dataset.n;
    const step=b.dataset.s==='w'?(n>0?incFor(cur):incFor(cur-0.01)):+b.dataset.s;
    const min=id==='w'?0:id==='itRest'?0.5:1;
    document.getElementById(id).value=fmt(Math.max(min,cur+step*n));
    if(id==='dur')setShareDur();
    return;
  }
  if(a==='start'){const d=dayOf(ui.date);d.start=Date.now();delete d.end;delete d.dur;d.checked=true;persistDay(ui.date);render();toast('Bom treino!');return}
  if(a==='restart'){
    const d=dayOf(ui.date),m=durMin(d);
    openSheet(`
      <div class="sheethead"><div><div class="eyebrow">Treino finalizado${m?` · ${m} min`:''}</div><h2>Reiniciar treino</h2></div>${closeBtn()}</div>
      <p class="note2">Seus checks e as cargas registradas continuam salvos. Só o cronômetro muda.</p>
      ${m?`<button class="primary" data-act="resume">Continuar de onde parou (${m} min)</button>`:''}
      <button class="${m?'ghost':'primary'}" data-act="restartZero">Começar o cronômetro do zero</button>`);
    return;
  }
  if(a==='resume'){const d=dayOf(ui.date),m=durMin(d)||0;d.start=Date.now()-m*60000;delete d.end;delete d.dur;persistDay(ui.date);closeSheet();render();toast('Treino retomado');return}
  if(a==='restartZero'){const d=dayOf(ui.date);d.start=Date.now();delete d.end;delete d.dur;persistDay(ui.date);closeSheet();render();toast('Cronômetro zerado. Bom treino!');return}
  if(a==='finish'){const d=dayOf(ui.date);d.end=Date.now();persistDay(ui.date);render();return openShare(ui.date)}
  if(a==='share')return openShare(b.dataset.k);
  if(a==='shareOpt'){ui.share[b.dataset.f]=b.dataset.v;return sheetShare()}
  if(a==='saveImg')return saveShare();
  if(a==='shareImg')return shareShare();
  if(a==='copyImg')return copyShare();
  if(a==='save'){
    const ex=b.dataset.id,e=exById(ex),kind=kindOf(e);let log;
    if(kind==='tempo'){const m=Math.round(readNum('m'));if(!m){toast('Informe quantos minutos você fez');return}log={id:newId(),ex,min:m,t:Date.now()}}
    else if(kind==='iso'){const r=Math.round(readNum('r'));if(!r){toast('Informe quantos segundos você segurou');return}log={id:newId(),ex,r,s:Math.max(1,Math.round(readNum('s'))),sec:true,t:Date.now()}}
    else{const r=Math.round(readNum('r'));if(!r){toast('Informe quantas repetições você fez');return}log={id:newId(),ex,w:readNum('w'),r,s:Math.max(1,Math.round(readNum('s'))),t:Date.now()}}
    const prevBest=bestOf(ex);
    const d=dayOf(ui.date);d.logs.push(log);d.checked=true;if(d.done&&!d.done.includes(ex))d.done.push(ex);autoStart(ui.date);
    persistDay(ui.date);closeSheet();render();
    toast(log.w!=null&&prevBest>0&&log.w>prevBest?`Novo recorde: ${fmt(log.w)} kg!`:`Salvo: ${setTxt(log)}`);
    return;
  }
  if(a==='delLog'){const d=S.days[ui.date];if(!d)return;d.logs=d.logs.filter(l=>l.id!==b.dataset.id);persistDay(ui.date);render();sheetLog(b.dataset.ex);toast('Registro apagado');return}
  if(a==='saveEx'){
    const name=document.getElementById('exName').value.trim(),group=document.getElementById('exGroup').value;
    if(!name){toast('Dê um nome para a máquina');return}
    if(b.dataset.id){const e=exById(b.dataset.id);e.name=name;e.group=group}
    else S.exercises.push({id:newId(),name,group,kind:TIMED.includes(group)?'tempo':'carga'});
    ui.group=group;persistProfile();closeSheet();render();toast(b.dataset.id?'Máquina atualizada':'Máquina adicionada');return;
  }
  if(a==='delEx'){
    if(!b.classList.contains('armed')){b.classList.add('armed');b.textContent='Toque de novo para confirmar';return}
    const id=b.dataset.id;
    S.exercises=S.exercises.filter(e=>e.id!==id);if(PH[id]){delete PH[id];persistPhoto(id)}
    for(const w of S.workouts)w.items=w.items.filter(it=>it.ex!==id);
    persistProfile();closeSheet();render();toast('Máquina excluída');return;
  }
  // trocar treino do dia
  if(a==='swap'){const k=b.dataset.k;ui.swap={k,d:parseKey(k).getDay(),weekOnly:false,scope:'dia'};return sheetSwap()}
  if(a==='setDay'){ui.swap={k:null,d:+b.dataset.d,weekOnly:true,scope:'semana'};return sheetSwap()}
  if(a==='scope'){ui.swap.scope=b.dataset.s;return sheetSwap()}
  if(a==='pickSwap'){
    const {k,d,scope}=ui.swap,wid=b.dataset.w,name=wid?wById(wid).t:'Descanso';
    if(scope==='dia'){dayOf(k).w=wid||'rest';persistDay(k);toast(`${ddmm(k)}: ${name}`)}
    else{S.schedule[String(d)]=wid||null;persistProfile();if(k&&S.days[k]?.w){delete S.days[k].w;persistDay(k)}toast(`Toda ${WDN[d].toLowerCase()}: ${name}`)}
    ui.group=null;closeSheet();render();return;
  }
  if(a==='clearSwap'){const {k}=ui.swap;if(S.days[k])delete S.days[k].w;persistDay(k);ui.group=null;closeSheet();render();return}
  // editar treinos
  if(a==='openW')return sheetWorkout(b.dataset.id);
  if(a==='newW'){const w={id:newId(),t:'Novo treino',items:[]};S.workouts.push(w);persistProfile();render();sheetWorkout(w.id);setTimeout(()=>{const i=document.getElementById('wTitle');i&&(i.focus(),i.select())},60);return}
  if(a==='mvItem'){const w=wById(ui.editW),i=+b.dataset.i,j=i+(+b.dataset.n);if(!w||j<0||j>=w.items.length)return;[w.items[i],w.items[j]]=[w.items[j],w.items[i]];persistProfile();render();return sheetWorkout(w.id)}
  if(a==='delW'){
    if(!b.classList.contains('armed')){b.classList.add('armed');b.textContent='Toque de novo para excluir';return}
    const id=b.dataset.id;S.workouts=S.workouts.filter(w=>w.id!==id);
    for(const d in S.schedule)if(S.schedule[d]===id)S.schedule[d]=null;
    persistProfile();closeSheet();render();toast('Treino excluído');return;
  }
  if(a==='editItem'){
    const wid=b.dataset.w,i=+b.dataset.i,w=wById(wid);if(!w)return;
    const it=i>=0?w.items[i]:null;
    const firstEx=S.exercises.find(e=>kindOf(e)==='carga')||S.exercises[0];
    ui.draft=it?{wid,idx:i,ret:b.dataset.ret,...it,ex:exById(it.ex)?it.ex:(firstEx&&firstEx.id)}:{wid,idx:-1,ret:b.dataset.ret,ex:firstEx?firstEx.id:'__new',sets:3,rmin:8,rmax:12,rest:1.5,newGroup:GN[0]};
    if(!ui.draft.newGroup)ui.draft.newGroup=exById(ui.draft.ex)?.group||GN[0];
    return sheetItem();
  }
  if(a==='backItem')return itemBack();
  if(a==='saveItem'){
    readDraft();const dr=ui.draft,w=wById(dr.wid);if(!w)return itemBack();
    let ex=dr.ex;
    if(ex==='__new'){
      const name=(dr.newName||'').trim();if(!name){toast('Dê um nome para a máquina');return}
      const ne={id:newId(),name,group:dr.newGroup,kind:TIMED.includes(dr.newGroup)?'tempo':'carga'};S.exercises.push(ne);ex=ne.id;
    }
    const kind=kindOf(exById(ex));
    let rmin=dr.rmin??8,rmax=dr.rmax??12;if(rmin>rmax)[rmin,rmax]=[rmax,rmin];
    const item=kind==='tempo'?{ex,mins:dr.mins??30}:{ex,sets:dr.sets??3,rmin,rmax,rest:dr.rest??1.5};
    if(dr.idx>=0)w.items[dr.idx]=item;else w.items.push(item);
    persistProfile();toast(dr.idx>=0?'Treino atualizado':'Exercício adicionado');return itemBack();
  }
  if(a==='delItem'){const dr=ui.draft,w=wById(dr.wid);if(w&&dr.idx>=0){w.items.splice(dr.idx,1);persistProfile();toast('Exercício retirado do treino')}return itemBack()}
  if(a==='month'){const m=ui.month;ui.month=new Date(m.getFullYear(),m.getMonth()+(+b.dataset.n),1);render();return}
  if(a==='calday'){const k=b.dataset.k;if(k>today())return;const d=dayOf(k);d.checked=!d.checked;persistDay(k);render();return}
  if(a==='goal'){S.goal=Math.min(7,Math.max(1,S.goal+(+b.dataset.n)));persistProfile();render();return}
});
document.addEventListener('change',ev=>{
  const id=ev.target.id;
  if(id==='progSel'){ui.prog=ev.target.value;render()}
  if(id==='dur'&&ui.share)setShareDur();
  if((id==='itEx'||id==='itGroup')&&ui.draft){readDraft();sheetItem()}
  if(id==='wTitle'){const w=wById(ui.editW),t=ev.target.value.trim();if(w&&t&&t!==w.t){w.t=t;persistProfile();render()}}
});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&sheetRoot.innerHTML){if(ui.draft)itemBack();else closeSheet()}});
document.addEventListener('visibilitychange',()=>{
  if(document.hidden)return;
  if(ui.date<today()&&!sheetRoot.innerHTML&&ui.lastSeen!==today()){ui.date=today();ui.group=null}
  ui.lastSeen=today();if(!sheetRoot.innerHTML)render();
});
ui.lastSeen=today();

ensureDefaults();
render();
if(window.TREINO_HOSTED){
  connectFirebase().catch(()=>{});
  if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
}else connectClaude().catch(()=>{});
</script>
