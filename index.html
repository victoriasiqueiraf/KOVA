<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KOVA">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<script src="firebase-config.js"></script>
</head>
<body>
<!--APP-->
<title>KOVA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700;800&display=swap">
<style>
/* KOVA — app de celular em coluna única; cards bem arredondados, barra de navegação flutuante em pílula.
   Escuro primeiro (preto, laranja, branco e cinza); modo claro opcional pelo botão do topo. */
:root{
  --bg:#0a0a0b; --surface:#151517; --surface-2:#1f1f22; --fg:#f6f5f3; --muted:#8e8d93; --line:#2b2b2f;
  --accent:#ff6b1a; --accent-2:#ff9a5c; --accent-3:#ffc49c; --accent-4:#ffe0c9; --accent-ink:#0a0a0b; --accent-soft:rgba(255,107,26,.15);
  --ok:#3ddc84; --ok-soft:rgba(61,220,132,.14); --danger:#ff5a4f; --shadow:0 12px 32px rgba(0,0,0,.45);
  --g-peito:#ff6b78; --g-costas:#5ea2ff; --g-ombros:#f2c14e; --g-biceps:#9a90ff; --g-triceps:#d57ef0;
  --g-quad:#3fd1ae; --g-post:#a2cf5a; --g-gluteos:#ff85b6; --g-pant:#45c9e2; --g-abd:#cf9a6c;
  --g-cardio:#ff9160; --g-along:#6fd184; --g-func:#cbd5e1;
  --display:"Lexend",system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"Lexend",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f2f1ee; --surface:#ffffff; --surface-2:#efeeea; --fg:#141414; --muted:#6f6e73; --line:#e3e1dc;
  --accent:#f25c05; --accent-2:#ff8a45; --accent-3:#ffb27a; --accent-4:#ffd7bb; --accent-ink:#ffffff; --accent-soft:#ffeadd;
  --ok:#16a34a; --ok-soft:#dcfce7; --danger:#c22f2a; --shadow:0 12px 28px rgba(20,20,20,.08);
  --g-peito:#c8323f; --g-costas:#2474d6; --g-ombros:#c98f00; --g-biceps:#5b4fd6; --g-triceps:#a63bc4;
  --g-quad:#12937a; --g-post:#5f861a; --g-gluteos:#dc4f8b; --g-pant:#0a8aa3; --g-abd:#8a5a33;
  --g-cardio:#e0632a; --g-along:#3b9d4e; --g-func:#4a5568;
  color-scheme:light;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;touch-action:manipulation;-webkit-user-select:none;user-select:none}
html{-webkit-text-size-adjust:100%;overscroll-behavior-y:none}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
main{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:16px calc(96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:22px}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;letter-spacing:.01em;text-wrap:balance}
h1{font-size:2rem;line-height:1}
h2{font-size:1.45rem;line-height:1.05}
h3{font-size:.8rem;font-family:var(--body);font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
p{margin:0}
.eyebrow{font-size:.78rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.muted{color:var(--muted)}
.section{display:flex;flex-direction:column;gap:10px}

.datebar{display:flex;align-items:center;gap:8px}
.datebar .t{flex:1;min-width:0;text-align:center}
.iconbtn{flex:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);font-size:1.3rem}
.iconbtn:disabled{opacity:.35;cursor:default}
.checkin{width:100%;min-height:52px;border-radius:14px;border:2px dashed var(--line);font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--muted);background:transparent}
.checkin.on{border:2px solid var(--ok);background:var(--ok-soft);color:var(--ok)}

.banner{background:var(--accent-soft);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.banner p{font-size:.92rem}

.chips{display:flex;gap:8px;overflow-x:auto;margin-inline:-16px;padding-inline:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 13px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:500;white-space:nowrap;display:flex;align-items:center;gap:7px}
.chip::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--gc)}
.chip.on{background:color-mix(in srgb,var(--gc) 16%,var(--surface));border-color:var(--gc);font-weight:600}
.chip .done{font-size:.75rem;color:var(--ok);font-weight:700}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-size:.78rem;font-weight:600;padding:3px 9px;border-radius:999px;background:color-mix(in srgb,var(--gc) 16%,var(--surface));color:var(--fg);border:1px solid color-mix(in srgb,var(--gc) 45%,transparent)}

.list{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 16px 13px 14px;border-top:1px solid var(--line);min-height:64px;box-shadow:inset 4px 0 0 var(--gc,transparent)}
.row:first-child{border-top:0}
.row .main{flex:1;min-width:0;padding-left:4px}
.row .name{font-weight:600}
.row .target{font-size:.86rem;font-weight:600;color:var(--gc,var(--muted))}
.row .sub{font-size:.86rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{flex:none;font-size:.8rem;font-weight:600;padding:4px 9px;border-radius:999px;background:var(--ok-soft);color:var(--ok)}
.chev{flex:none;color:var(--muted);font-size:1.2rem}
.addrow{color:var(--accent);font-weight:600;justify-content:center;min-height:52px;box-shadow:none}

.planhead{display:flex;flex-direction:column;gap:6px}
.planhead .meta{font-size:.88rem;color:var(--muted)}
.empty{padding:20px 16px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:16px}

.summary .item{display:flex;justify-content:space-between;gap:12px;padding:12px 16px 12px 14px;border-top:1px solid var(--line);box-shadow:inset 4px 0 0 var(--gc,transparent)}
.summary .item:first-child{border-top:0}
.summary .sets{text-align:right;font-size:.92rem}

.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.stat .v{font-family:var(--display);font-size:1.9rem;font-weight:700;line-height:1}
.stat .v small{font-size:1rem;color:var(--muted);font-weight:600}
.stat .l{font-size:.82rem;color:var(--muted)}
.stat .v.up{color:var(--ok)}

.cal{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px}
.calhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.calhead h2{text-align:center}
.calhead h2::first-letter{text-transform:uppercase}
.grid7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wd{text-align:center;font-size:.75rem;font-weight:600;color:var(--muted);padding:4px 0}
.day{aspect-ratio:1;max-width:100%;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-weight:500;font-variant-numeric:tabular-nums}
.day .dots{display:flex;gap:2px;height:5px}
.day .dots i{width:5px;height:5px;border-radius:50%;background:var(--gc)}
.day.today{box-shadow:inset 0 0 0 2px var(--accent)}
.day.on{background:var(--accent-soft);color:var(--fg);font-weight:700}
.day.future{color:var(--muted);opacity:.45;cursor:default}
.day.blank{visibility:hidden}
.hint{font-size:.85rem;color:var(--muted);text-align:center;margin-top:8px}

.goal{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.mini{display:flex;align-items:center;gap:10px}
.mini button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);font-size:1.2rem}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px}
svg text{fill:var(--muted);font-family:var(--body);font-size:11px}

select,input[type=text]{width:100%;font:inherit;font-size:16px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}

.hist .item{display:flex;justify-content:space-between;gap:12px;padding:11px 16px;border-top:1px solid var(--line);font-size:.95rem}
.hist .item:first-child{border-top:0}
.pr{color:var(--ok);font-weight:600;font-size:.8rem;margin-left:6px}

/* Plan */
.wkrow .wdn{flex:none;width:40px;font-family:var(--display);font-weight:700;font-size:1.1rem;text-transform:uppercase;color:var(--muted)}
.wkrow.today .wdn{color:var(--accent)}
.wkrow .main{display:flex;flex-direction:column;gap:5px}
.wkrow .rest{color:var(--muted);font-weight:500}
.sm{flex:none;min-height:36px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:.9rem;color:var(--accent)}
.titlerow{display:flex;align-items:center;gap:12px}
.titlerow h2{flex:1;min-width:0}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:12px;background:var(--bg)}
.seg button{min-height:40px;border-radius:9px;font-weight:600;font-size:.92rem;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.row.sel{background:var(--accent-soft)}
.row .check{flex:none;color:var(--accent);font-weight:700}
.irow{display:flex;align-items:center;border-top:1px solid var(--line);box-shadow:inset 4px 0 0 var(--gc,transparent)}
.irow:first-child{border-top:0}
.irow .row{border-top:0;box-shadow:none;flex:1;min-width:0}
.mv{display:flex;flex-direction:column;padding-right:8px}
.mv button{width:34px;height:28px;border-radius:8px;color:var(--muted);font-size:.9rem}
.mv button:disabled{opacity:.25;cursor:default}
.pic{flex:none;width:52px;height:52px;border-radius:12px;background:color-mix(in srgb,var(--gc,var(--muted)) 13%,var(--surface));overflow:hidden;display:grid;place-items:center}
.pic svg{width:100%;height:100%;display:block}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.pic.lg{width:112px;height:112px;border-radius:18px}
.pic .eq{fill:none;stroke:var(--muted);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.pic .cab{fill:none;stroke:var(--muted);stroke-width:1.2;stroke-dasharray:2 2}
.pic .fig,.pic .fig2{fill:none;stroke:var(--gc,var(--fg));stroke-width:4.4;stroke-linecap:round;stroke-linejoin:round}
.pic .fig2{opacity:.5}
.pic .head{fill:var(--gc,var(--fg))}
.pic .plate{fill:var(--fg);opacity:.72}
.pic .ini{font-family:var(--display);font-weight:700;font-size:1.25rem;color:var(--gc,var(--fg))}
.pic.lg .ini{font-size:2.4rem}
.logtop{display:flex;gap:14px;align-items:flex-start}
.logtop .c{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.logtop .eyebrow{color:var(--gc)}
.phbtns{display:flex;gap:14px;flex-wrap:wrap;margin-top:4px}
.phbtns .link{text-align:left}
.exsel{display:flex;gap:12px;align-items:flex-end}
.exsel .field{flex:1;min-width:0}
.tick{flex:none;width:48px;align-self:stretch;display:grid;place-items:center}
.tick span{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:1rem;font-weight:700;color:transparent;transition:background .15s,border-color .15s}
.tick.on span{background:var(--gc);border-color:var(--gc);color:var(--surface)}
.irow.done .name{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1.5px}
.irow .row .main{padding-left:0}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:4px;transition:width .25s}
.today-log{color:var(--ok);font-weight:600}
.wtitle{font-family:var(--display);font-size:1.45rem;font-weight:700}
.timer{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 8px 8px 14px}
.timer .clock{flex:1;min-width:0;font-family:var(--display);font-weight:700;font-size:1.6rem;font-variant-numeric:tabular-nums;line-height:1}
.timer .clock small{display:block;font-family:var(--body);font-size:.75rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}
.timer .sm{min-height:44px}
.sm.solid{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.seg3{grid-template-columns:repeat(3,1fr)}
.seg4{grid-template-columns:repeat(4,1fr)}
.seg4 button{font-size:.85rem}
.dayphoto{position:relative;border-radius:16px;overflow:hidden;background:var(--surface);border:1px solid var(--line)}
.dayphoto img{display:block;width:100%;aspect-ratio:2/1;object-fit:cover}
.dayphoto .bar2{position:absolute;left:0;right:0;bottom:0;display:flex;gap:8px;justify-content:flex-end;padding:10px;background:linear-gradient(transparent,rgba(0,0,0,.55))}
.dayphoto .bar2 button{min-height:38px;padding:0 14px;border-radius:10px;background:rgba(255,255,255,.92);color:#14171c;font-weight:600;font-size:.88rem}
.addphoto{width:100%;min-height:64px;border-radius:14px;border:2px dashed var(--line);display:flex;align-items:center;justify-content:center;gap:10px;color:var(--muted);font-weight:600}
.addphoto svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.day.ph{background-size:cover;background-position:center;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.8);font-weight:700}
.day.ph .dots{display:none}
.gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.gallery button{position:relative;border-radius:12px;overflow:hidden;aspect-ratio:4/5;background:var(--line)}
.gallery img{width:100%;height:100%;object-fit:cover;display:block}
.gallery span{position:absolute;left:6px;bottom:6px;font-size:.75rem;font-weight:700;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.8)}
.viewer img{display:block;width:100%;border-radius:14px;max-height:60vh;object-fit:contain;background:#000}
.stickerbox{border-radius:16px;padding:18px;display:grid;place-items:center}
.stickerbox img{display:block;max-width:100%;max-height:34vh}

.tgl{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer}
.tgl span{flex:1;min-width:0;display:flex;flex-direction:column}
.tgl small{font-size:.8rem;color:var(--muted)}
.tgl input{position:absolute;opacity:0;width:1px;height:1px}
.tgl i{flex:none;width:50px;height:30px;border-radius:15px;background:var(--line);position:relative;transition:background .15s}
.tgl i::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.tgl input:checked+i{background:var(--ok)}
.tgl input:checked+i::after{transform:translateX(20px)}
.tgl input:focus-visible+i{outline:2px solid var(--accent);outline-offset:2px}

/* Outras atividades */
.actgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.actgrid button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:12px;background:var(--bg);border:1.5px solid transparent;font-size:.75rem;font-weight:600;text-align:center;line-height:1.1}
.actgrid .pic.sm{width:48px;height:48px;border-radius:12px;grid-template-columns:100%;grid-template-rows:100%}
.actgrid .pic.sm svg{width:48px;height:48px}
.actgrid button.on{border-color:var(--accent);background:var(--accent-soft)}
.day.act{position:relative}
.day.act::after{content:"";position:absolute;inset:3px;border-radius:8px;border:2px dotted var(--accent);pointer-events:none}

/* Primeiro acesso */
.goals{display:flex;flex-direction:column;gap:10px}
.goalc{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:14px 16px;border-radius:14px;background:var(--surface);border:1.5px solid var(--line)}
.goalc b{font-family:var(--display);font-size:1.35rem}
.goalc span{font-size:.9rem;color:var(--muted)}
.goalc.on{border-color:var(--accent);background:var(--accent-soft)}
.daysel{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.daysel button{min-height:52px;border-radius:12px;background:var(--surface);border:1.5px solid var(--line);font-family:var(--display);font-size:1.5rem;font-weight:700}
.daysel button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}

/* Descanso */
.restbar{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 8px);z-index:30;width:min(560px,calc(100% - 24px));background:var(--fg);color:var(--bg);border-radius:16px;padding:10px 12px 8px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px}
.restbar .rtop{display:flex;align-items:center;gap:8px}
.restbar .rl{flex:1;min-width:0;font-weight:600;font-size:.92rem}
.restbar .rt{font-family:var(--display);font-weight:700;font-size:1.7rem;line-height:1;min-width:3.2ch;text-align:right}
.restbar button{min-height:36px;padding:0 10px;border-radius:10px;background:color-mix(in srgb,var(--bg) 16%,transparent);color:var(--bg);font-weight:700;font-size:.85rem}
.restbar .rp{height:5px;border-radius:3px;background:color-mix(in srgb,var(--bg) 20%,transparent);overflow:hidden}
.restbar .rp i{display:block;height:100%;width:0;background:var(--ok);transition:width .25s linear}
.restbar.fin{background:var(--ok);color:#fff}
.restbar.fin .rl{color:#fff}
.restbar.fin button{background:rgba(255,255,255,.25);color:#fff}

/* Amigos */
.gchip::before{display:none}
.ghead{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.ghead .gh1{flex:1;min-width:0}
.av2{flex:none;width:44px;height:44px;border-radius:50%;object-fit:cover;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:1.3rem}
.rank .item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.rank .item:first-child{border-top:0}
.rank .item.me{background:var(--accent-soft)}
.rank .pos{width:26px;text-align:center;font-family:var(--display);font-weight:700;font-size:1.2rem;color:var(--muted)}
.rank .main{flex:1;min-width:0}
.rank .name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank .sub{font-size:.8rem;color:var(--muted)}
.rank .days{display:flex;flex-direction:column;align-items:flex-end;line-height:1}
.rank .days b{font-family:var(--display);font-size:1.8rem}
.rank .days small{font-size:.72rem;color:var(--muted)}
.post{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.post .phd{display:flex;align-items:center;gap:10px}
.post .phd .main{flex:1;min-width:0}
.post .phd .name{font-weight:600}
.post .phd .sub{font-size:.8rem;color:var(--muted)}
.post .ptitle{font-family:var(--display);font-weight:700;font-size:1.5rem;line-height:1.05}
.post .pimg{width:100%;border-radius:12px;max-height:420px;object-fit:cover}
.post .pstats{font-size:.92rem;color:var(--muted);font-weight:600}
.post .pact{display:flex;align-items:center;justify-content:space-between}
.fire{min-height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);font-weight:700}
.fire.on{background:color-mix(in srgb,var(--g-cardio) 18%,var(--surface));border-color:var(--g-cardio)}

/* Tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab .av{width:24px;height:24px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 2px transparent}
.tab.on .av{box-shadow:0 0 0 2px var(--accent)}
.profhead{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding-block:8px}
.avatar{width:104px;height:104px;border-radius:50%;object-fit:cover;background:var(--accent-soft);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:2.6rem;color:var(--accent);box-shadow:0 0 0 4px var(--surface),0 0 0 6px var(--accent)}
.profhead h1{font-size:2.2rem}
.profhead .since{font-size:.88rem;color:var(--muted)}
.gbars{display:flex;flex-direction:column;gap:10px}
.gbar{display:grid;grid-template-columns:96px 1fr 34px;gap:10px;align-items:center;font-size:.9rem}
.gbar .tr{height:12px;border-radius:6px;background:var(--line);overflow:hidden}
.gbar .tr i{display:block;height:100%;border-radius:6px;background:var(--gc)}
.gbar .n{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.recs .item{display:flex;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid var(--line)}
.recs .item:first-child{border-top:0}
.recs .item .main{flex:1;min-width:0}
.recs .item .name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.recs .item .sub{font-size:.82rem;color:var(--muted)}
.recs .kg{font-family:var(--display);font-weight:700;font-size:1.4rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.recs .pic{width:44px;height:44px}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 8px;font-size:.68rem;font-weight:600;color:var(--muted)}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--accent)}

/* Sheet */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:10}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:11;background:var(--surface);border-radius:20px 20px 0 0;box-shadow:var(--shadow);max-height:90vh;overflow-y:auto;padding-inline:16px;padding-block:10px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet .in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.sheet.still{animation:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(40px);opacity:.4}}}
.sheethead{display:flex;align-items:flex-start;gap:12px}
.sheethead>div{flex:1;min-width:0}
.sheethead .eyebrow{color:var(--gc)}
.info{display:flex;gap:8px;flex-wrap:wrap}
.info span{background:var(--bg);border-radius:10px;padding:6px 10px;font-size:.88rem}
.tip{border-radius:12px;padding:10px 12px;font-size:.92rem;background:var(--ok-soft);color:var(--fg)}
.tip b{color:var(--ok)}
.note2{font-size:.88rem;color:var(--muted)}
.steppers{display:flex;flex-direction:column;gap:10px}
.stepper{display:flex;align-items:center;gap:10px}
.stepper label{flex:1;font-weight:600;min-width:0}
.stepper label small{display:block;font-weight:400;color:var(--muted);font-size:.8rem}
.stepper button{flex:none;width:48px;height:48px;border-radius:12px;background:var(--bg);font-size:1.5rem;font-weight:500}
.stepper input{flex:none;width:80px;text-align:center;font-family:var(--display);font-size:1.7rem;font-weight:700;padding:6px 4px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-variant-numeric:tabular-nums}
.primary{width:100%;min-height:52px;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:1.05rem}
.ghost{width:100%;min-height:46px;border-radius:14px;border:1px solid var(--line);font-weight:600;background:var(--surface)}
.danger{color:var(--danger)}
.danger.armed{background:var(--danger);color:var(--surface);border-color:var(--danger)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:600;font-size:.9rem}
.entries .item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.entries .item:first-child{border-top:0}
.del{width:36px;height:36px;border-radius:10px;color:var(--danger);font-size:1.1rem}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:.92rem;max-width:calc(100% - 32px);text-align:center}
.acct{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:.8rem;color:var(--muted);text-align:center}
.link{color:var(--accent);font-weight:600;text-decoration:underline;font-size:.85rem}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:48px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-weight:600}
.gbtn svg{width:18px;height:18px}

/* ================= KOVA: camada visual ================= */
body{font-size:15px}
main{max-width:480px;gap:16px;padding-block:12px calc(112px + env(safe-area-inset-bottom,0px))}
h1{font-size:1.75rem;font-weight:800;letter-spacing:-.01em}
h2{font-size:1.35rem;font-weight:800;letter-spacing:-.01em}
h3{font-size:.72rem;letter-spacing:.09em}
.eyebrow{font-size:.72rem;letter-spacing:.09em}
.hint{font-size:.8rem}
.card,.list,.stat,.cal,.goal,.ghead,.post,.empty,.tgl,.timer,.dayphoto{border-radius:24px;border-color:transparent;background:var(--surface)}
.empty{border:2px dashed var(--line);background:transparent}
.list{border:0}
.row{border-top-color:var(--line);box-shadow:none;padding:12px 14px;min-height:66px}
.irow{box-shadow:none;border-top-color:var(--line)}
.summary .item,.pitem{box-shadow:none}
.row .target{color:var(--accent)}
.row .name{font-weight:600}
.pic{background:var(--surface-2);border-radius:16px}
.pic .fig,.pic .fig2{stroke:var(--accent)}
.pic .head{fill:var(--accent)}
.pic .ini{color:var(--accent)}
.pill{background:var(--accent-soft);color:var(--accent);border:0}
.chip{border:0;background:var(--surface)}
.chip::before{background:var(--gc)}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip.on::before{background:var(--accent-ink)}
.chip .done{color:inherit}
.tick.on span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tick span{border-color:var(--line)}
.bar i{background:var(--accent)}
.tcard-log{color:var(--accent)}
.iconbtn{border:0;background:var(--surface);border-radius:50%}
.sm{border:0;background:var(--surface-2);color:var(--fg);border-radius:999px}
.sm.solid{background:var(--accent);color:var(--accent-ink)}
.primary{border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:700}
.ghost{border-radius:999px;border:0;background:var(--surface-2)}
.link{color:var(--accent)}
.checkin{border-radius:999px;border:2px dashed var(--line)}
.checkin.on{border:0;background:var(--accent-soft);color:var(--accent)}
.stat .v{font-family:var(--display);font-weight:800;font-size:1.7rem}
.stat .v.up{color:var(--accent)}
.day{border-radius:12px}
.day.on{background:var(--accent);color:var(--accent-ink)}
.goalc,.daysel button{border-radius:20px;border:0;background:var(--surface)}
.goalc.on,.daysel button.on{background:var(--accent);color:var(--accent-ink)}
.goalc.on span{color:inherit;opacity:.8}
.seg{border-radius:999px;background:var(--surface);grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:1fr}
.seg button{border-radius:999px}
.seg button.on{background:var(--accent);color:var(--accent-ink);box-shadow:none}
.sheet{background:var(--bg);border-radius:28px 28px 0 0}
.sheet .card,.sheet .list{background:var(--surface)}
.stepper button{background:var(--surface-2);border-radius:14px}
.stepper input{border:0;background:var(--surface);border-radius:14px}
select,input[type=text]{border:0;background:var(--surface);border-radius:14px}
.info span{background:var(--surface)}
.tip{background:var(--accent-soft)}
.tip b{color:var(--accent)}
.badge{background:var(--accent-soft);color:var(--accent)}
.rank .item.me{background:var(--accent-soft)}
.fire.on{background:var(--accent-soft);border-color:var(--accent)}
.av2{background:var(--accent);color:var(--accent-ink)}
.gbtn{border:0;background:var(--surface-2);border-radius:999px}
.banner{background:var(--surface);border-radius:24px}
.addphoto{border-radius:24px}
.tgl{border:0}
.restbar{border-radius:20px}

/* barra de navegação flutuante */
.tabs{left:50%;right:auto;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));width:auto;max-width:calc(100% - 24px);border:1px solid var(--line);border-radius:999px;background:var(--surface);box-shadow:var(--shadow);padding:6px}
.tabs .in{display:flex;gap:2px;max-width:none}
.tab{flex-direction:row;gap:7px;height:48px;min-width:46px;padding:0 12px;border-radius:999px;font-size:.86rem;color:var(--muted)}
.tab span.tl{display:none}
.tab.on{background:var(--accent);color:var(--accent-ink)}
.tab.on span.tl{display:inline}
.tab .av{width:24px;height:24px;border-radius:50%;object-fit:cover}

/* topo: marca + saudação */
.khead{display:flex;align-items:center;justify-content:space-between;gap:12px;position:relative;min-height:44px}
.khead>.kbrand{position:absolute;left:50%;transform:translateX(-50%)}
.khead>.kbrand+.round{margin-left:auto}
.kbrand{display:flex;align-items:center;gap:8px;font-weight:800;letter-spacing:.14em;font-size:1rem}
.kbrand svg{width:28px;height:24px}
.round{width:44px;height:44px;border-radius:50%;background:var(--surface);display:grid;place-items:center;flex:none}
.round svg{width:21px;height:21px;stroke:var(--fg);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hello{display:flex;align-items:center;gap:12px}
.hello .hi{flex:1;min-width:0}
.hello .hi small{display:block;color:var(--muted);font-size:.8rem}
.hello .hi b{font-size:1.2rem;font-weight:800}

/* card de nível */
.level{display:flex;flex-direction:column;gap:12px;padding:18px}
.level .row1{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.level .lv{font-size:2.2rem;font-weight:800;line-height:1;letter-spacing:-.02em}
.level .lv small{font-size:.85rem;font-weight:600;color:var(--muted);letter-spacing:0;margin-left:6px}
.streak{display:flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:7px 12px;font-weight:700;font-size:.8rem;white-space:nowrap}
.streak svg{width:15px;height:15px;fill:var(--accent)}
.xpbar{height:14px;border-radius:7px;background:var(--surface-2);overflow:hidden;display:flex;gap:3px}
.xpbar i{display:block;height:100%;border-radius:7px}
.level .foot{display:flex;justify-content:space-between;gap:10px;font-size:.78rem;color:var(--muted)}
.warn{box-shadow:inset 0 0 0 2px var(--accent);display:flex;flex-direction:column;gap:6px;padding:16px}
.warn .wt{display:flex;justify-content:space-between;align-items:center;gap:10px}
.warn .wt b{font-weight:700}
.xpchip{display:inline-block;flex:none;font-size:.72rem;font-weight:800;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:5px 9px;white-space:nowrap}

/* treino do dia (card laranja) */
.tcard{background:var(--accent);color:var(--accent-ink);border-radius:28px;padding:20px;display:flex;gap:16px;align-items:center}
.tcard .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.tcard .lbl{font-size:.7rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;opacity:.7}
.tcard h2{font-size:1.65rem;color:inherit}
.tcard .tchips{display:flex;flex-wrap:wrap;gap:6px}
.tcard .tchips span{background:rgba(0,0,0,.14);border-radius:999px;padding:4px 10px;font-size:.74rem;font-weight:600}
:root[data-theme="light"] .tcard .tchips span{background:rgba(255,255,255,.24)}
.tcard .tbtns{display:flex;gap:8px;margin-top:4px;flex-wrap:wrap}
.tcard .tbtns button{border-radius:999px;padding:9px 14px;font-weight:700;font-size:.85rem;background:rgba(0,0,0,.16);color:inherit}
:root[data-theme="light"] .tcard .tbtns button{background:rgba(255,255,255,.24)}
.tcard .tbtns button.solid{background:var(--accent-ink);color:var(--accent)}
.ring{flex:none;width:96px;height:96px;position:relative;align-self:center}
.ring svg{width:100%;height:100%;transform:rotate(-90deg);display:block}
.ring .rc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-align:center}
.ring .rc b{font-weight:800;font-size:1.55rem;line-height:1;letter-spacing:-.02em}
.ring .rc b span{font-size:.95rem;font-weight:700;opacity:.6;letter-spacing:0}
.ring .rc small{font-size:.6rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.7;line-height:1}
.rest-day{background:var(--surface);color:var(--fg)}

/* semana em pílulas */
.wkstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wkstrip button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 0;border-radius:18px;background:var(--surface)}
.wkstrip span{font-size:.7rem;color:var(--muted);font-weight:700}
.wkstrip b{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:.8rem;background:var(--surface-2)}
.wkstrip .on b{background:var(--accent);color:var(--accent-ink)}
.wkstrip .sel{box-shadow:inset 0 0 0 2px var(--accent)}
.wkstrip .fut{opacity:.45}
.wkstrip b.ph{background-size:cover;background-position:center;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.85);box-shadow:0 0 0 2px var(--accent)}
/* Dia com foto: a miniatura vence o fundo laranja de presença (o atalho background apagava o tamanho e a posição). */
.day.on .dots i{box-shadow:0 0 0 1.5px rgba(0,0,0,.35)}
.day.ph,.day.ph.on,.wkstrip .on b.ph{background-color:var(--surface-2);background-size:cover;background-position:center;background-repeat:no-repeat;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.85)}
.datebar h1{font-size:1.25rem}
.datebar .eyebrow{font-size:.68rem}

/* molduras por faixa */
.fr{position:relative;flex:none;display:inline-grid;place-items:center;border-radius:50%;padding:3px;--sz:46px}
.fr .ph{width:var(--sz);height:var(--sz);border-radius:50%;overflow:hidden;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--accent-ink);font-weight:800;font-size:calc(var(--sz)*.4);box-shadow:0 0 0 2px var(--bg)}
.fr .ph img{width:100%;height:100%;object-fit:cover;display:block}
.fr.bronze{background:conic-gradient(#8a4b22,#e0a070,#6e3a18,#c47a45,#8a4b22)}
.fr.prata{background:conic-gradient(#7f868e,#f4f6f8,#6f767e,#dfe3e7,#7f868e)}
.fr.ouro{background:conic-gradient(#a8741a,#ffe38f,#c48c1c,#fff4c9,#a8741a)}
.fr.diamante{background:conic-gradient(#56e1ff,#b48cff,#ff8ad8,#ffe38f,#56e1ff);box-shadow:0 0 14px rgba(150,140,255,.55)}
.fr .lvb{position:absolute;bottom:-5px;left:50%;transform:translateX(-50%);min-width:22px;height:18px;padding:0 6px;border-radius:9px;font-size:.62rem;font-weight:800;display:grid;place-items:center;color:#14110d;box-shadow:0 0 0 2px var(--bg)}
.fr.bronze .lvb{background:#d08b52}.fr.prata .lvb{background:#dfe3e7}.fr.ouro .lvb{background:#ffd966}.fr.diamante .lvb{background:linear-gradient(90deg,#56e1ff,#ff8ad8)}
.fr .spark{position:absolute;top:-2px;right:-2px;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:.66rem;box-shadow:0 0 0 2px var(--bg)}
.fr.ouro .spark{background:#ffd966;color:#14110d}
.fr.diamante .spark{background:linear-gradient(135deg,#56e1ff,#ff8ad8);color:#fff}
.fr.sm{--sz:40px}
.fr.big{--sz:96px;padding:5px}
.fr.big .lvb{height:24px;font-size:.75rem;min-width:30px;bottom:-7px}
.fr.big .spark{width:26px;height:26px;font-size:.9rem;top:0;right:0}
.cam{position:absolute;right:-4px;bottom:16px;width:34px;height:34px;border-radius:50%;background:var(--surface);display:grid;place-items:center;box-shadow:0 0 0 3px var(--bg)}
.cam svg{width:17px;height:17px;stroke:var(--fg);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.frames{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.frames div{background:var(--surface);border-radius:20px;padding:14px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.frames div.off{opacity:.4}
.frames b{font-size:.76rem}.frames span{font-size:.64rem;color:var(--muted)}
.frames div.cur{box-shadow:inset 0 0 0 2px var(--accent)}

/* XP por área */
.rings{display:flex;align-items:center;gap:14px;padding:18px}
.rings svg{flex:none;width:150px;height:150px}
.legend{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}
.legend div{display:flex;align-items:center;gap:10px}
.legend i{flex:none;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-style:normal;font-size:.7rem;font-weight:800;color:#14110d}
.legend b{display:block;font-size:.88rem;font-weight:600}
.legend span{font-size:.74rem;color:var(--muted)}
.xbars{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;align-items:end}
.xbar{display:flex;flex-direction:column;align-items:center;gap:7px}
.xbar .tr{width:100%;max-width:54px;height:160px;border-radius:999px;background:var(--surface-2);display:flex;align-items:flex-end;overflow:hidden}
.xbar .fl{width:100%;border-radius:999px;display:flex;justify-content:center;padding-top:12px;font-size:.64rem;font-weight:800;color:#14110d;background:linear-gradient(180deg,var(--accent-2),var(--accent))}
.xbar small{font-size:.68rem;color:var(--muted);font-weight:600;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.xbar .lvl{font-size:.68rem;font-weight:800}
.rules{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rules div{background:var(--surface-2);border-radius:18px;padding:12px}
.rules b{display:block;color:var(--accent);font-weight:800;font-size:1.02rem}
.rules span{font-size:.76rem;color:var(--muted)}

/* questionário */
.qopt{display:flex;flex-direction:column;gap:8px}
.qopt button{text-align:left;padding:13px 16px;border-radius:16px;font-weight:600;background:var(--surface-2)}
.qopt button.on{background:var(--accent);color:var(--accent-ink)}
.brow{display:flex;align-items:center;gap:10px}
.brow .bl{flex:1;min-width:0}
.brow .bl b{display:block;font-weight:600}
.brow .bl span{font-size:.78rem;color:var(--muted)}
.brow button{width:44px;height:44px;border-radius:14px;background:var(--surface-2);font-size:1.3rem}
.brow .bv{min-width:56px;text-align:center;font-size:1.4rem;font-weight:800}
.qnote{background:var(--surface-2);border-radius:16px;padding:10px 12px;font-size:.8rem}
.lockcard{display:flex;gap:12px;align-items:flex-start;padding:16px;box-shadow:inset 0 0 0 2px var(--accent)}

/* chave liga/desliga */
.switch{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:16px}
.switch .sl{flex:1;min-width:0}
.switch .sl b{display:block;font-weight:600}
.switch .sl span{font-size:.8rem;color:var(--muted)}
.sw{flex:none;width:50px;height:30px;border-radius:15px;background:var(--surface-2);position:relative;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s}
.sw.on{background:var(--accent)}
.sw.on::after{transform:translateX(20px)}

/* cortador de foto */
.crop{position:fixed;inset:0;z-index:60;background:#000;display:flex;flex-direction:column;gap:16px;padding-inline:16px;padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(20px + env(safe-area-inset-bottom,0px));color:#fff}
.crop .ct{display:flex;align-items:center;justify-content:space-between}
.crop .ct button{color:#fff;font-weight:600;padding:8px 4px}
.crop .ct button.ok{color:#ff8a45}
.crop .stage{flex:1;min-height:0;display:grid;place-items:center}
.crop .box{position:relative;overflow:hidden;touch-action:none;cursor:grab;border-radius:6px;box-shadow:0 0 0 2px rgba(255,255,255,.85)}
.crop .box img{position:absolute;left:0;top:0;transform-origin:0 0;user-select:none;-webkit-user-drag:none;pointer-events:none;max-width:none}
.crop .box.circle::after{content:"";position:absolute;inset:0;border-radius:50%;box-shadow:0 0 0 999px rgba(0,0,0,.55);pointer-events:none}
.crop .grid{position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,transparent 33%,rgba(255,255,255,.25) 33%,rgba(255,255,255,.25) calc(33% + 1px),transparent calc(33% + 1px),transparent 66%,rgba(255,255,255,.25) 66%,rgba(255,255,255,.25) calc(66% + 1px),transparent calc(66% + 1px)),linear-gradient(transparent 33%,rgba(255,255,255,.25) 33%,rgba(255,255,255,.25) calc(33% + 1px),transparent calc(33% + 1px),transparent 66%,rgba(255,255,255,.25) 66%,rgba(255,255,255,.25) calc(66% + 1px),transparent calc(66% + 1px))}
.crop .zoom{display:flex;align-items:center;gap:12px;font-size:.85rem;color:#bbb}
.crop input[type=range]{flex:1;accent-color:#ff6b1a}
.crop .chint{text-align:center;font-size:.8rem;color:#aaa;margin:0}

/* perfil de amiga */
.prof{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.prof h1{margin-top:8px}
.badges{display:flex;gap:10px;overflow-x:auto;margin-inline:-16px;padding-inline:16px;scrollbar-width:none}
.badgec{flex:none;width:96px;background:var(--surface);border-radius:22px;padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.badgec .md{width:48px;height:48px;border-radius:50%;background:var(--accent-soft);display:grid;place-items:center}
.badgec .md svg{width:26px;height:26px;fill:var(--accent)}
.badgec.off{opacity:.4}
.badgec span{font-size:.7rem;font-weight:600}
.rank .item{cursor:pointer}
.ndemo{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:20px;background:var(--surface-2)}
.ndemo .ni{flex:none;width:40px;height:40px;border-radius:11px;background:#0a0a0b;display:grid;place-items:center}
.ndemo .ni svg{width:26px;height:22px}
.ndemo .nt{display:flex;flex-direction:column;min-width:0;font-size:.88rem}
.ndemo .nt small{font-weight:500;color:var(--muted);margin-left:6px}

function picSvg(id){

  const main=[L('s','p'),L('p','k','f'),L('s','e','w')].join('');
  const two=[L('p','k2','f2'),L('s','e2','w2')].join('');
  const plates=(P.o||'').split(';').filter(Boolean).map(o=>{const [x,y,r]=o.split(',');return `<circle class="plate" cx="${x}" cy="${y}" r="${r}"/>`}).join('');

  return picCache[id]=`<svg viewBox="0 0 64 64" aria-hidden="true">${P.eq?`<path class="eq" d="${P.eq}"/>`:''}${P.cab?`<path class="cab" d="${P.cab}"/>`:''}${two?`<path class="${P.front?'fig':'fig2'}" d="${two}"/>`:''}<path class="fig" d="${main}"/>${plates}<circle class="head" cx="${hx}" cy="${hy}" r="4.8"/></svg>`;
}

function ensureDefaults(){

  if(v<2){
    for(const d of Object.values(CAT)){
      const same=S.exercises.find(e=>e.id===d.id||norm(e.name)===norm(d.name));
      if(same){if(!same.kind)same.kind=d.kind}else S.exercises.push({...d});
    }
    ch=true;
  }
  if(S.onb===false&&!Array.isArray(S.workouts)){S.workouts=[];S.schedule={'0':null,'1':null,'2':null,'3':null,'4':null,'5':null,'6':null};ch=true}
  if(v<3||!Array.isArray(S.workouts)){
    S.workouts=DEFAULT_WORKOUTS.map(w=>({id:w.id,t:w.t,items:w.items.map(a=>{
      let e=resolveEx(a[0]);if(!e){e={...CAT[a[0]]};S.exercises.push(e)}
      return a.length===2?{ex:e.id,mins:a[1]}:{ex:e.id,sets:a[1],rmin:a[2],rmax:a[3],rest:a[4]};
    })}));
    S.schedule={...DEFAULT_SCHEDULE};ch=true;
  }
  if(!S.schedule){S.schedule={...DEFAULT_SCHEDULE};ch=true}
  if(!Array.isArray(S.groups))S.groups=[];
  if((S.v||3)<6){for(const d of Object.values(CAT)){if(!S.exercises.some(e=>e.id===d.id||norm(e.name)===norm(d.name))){S.exercises.push({...d});ch=true}}}

}

const backend={col:null,skipCache:false,unsubs:[]};

function persistDay(k){
  saveLocal();scheduleStats();if(!backend.col)return;
  const d=S.days[k];
  if(!d||(!d.checked&&!d.logs.length&&!d.w&&!d.start&&!(d.done&&d.done.length)&&!(d.acts&&d.acts.length)))return queueWrite('day-'+k,null);
  const body={kind:'day',date:k,checked:!!d.checked,logs:d.logs};if(d.w)body.w=d.w;if(d.done)body.done=d.done;
  for(const f of ['start','end','dur'])if(d[f]!=null)body[f]=d[f];
  if(d.acts&&d.acts.length)body.acts=d.acts;
  queueWrite('day-'+k,body);
}
function queueWrite(id,body){pending[id]={body};if(!busy[id])flush(id)}
async function flush(id){
  busy[id]=true;
  while(pending[id]&&backend.col){
    const {body}=pending[id];delete pending[id];
    const ref=backend.col.doc(id);const op=()=>body?ref.set(body):ref.delete();
    try{await op()}catch(e){
      if(e&&e.code==='unavailable'){await new Promise(r=>setTimeout(r,600+Math.random()*900));try{await op()}catch(e2){writeFailed(e2)}}
      else writeFailed(e);
    }
  }
  busy[id]=false;
}
function writeFailed(e){
  toast(e&&e.code==='quota_exceeded'?'Espaço na nuvem cheio. Os dados continuam salvos neste aparelho.':'Não deu para salvar na nuvem agora. Os dados continuam salvos neste aparelho.');
}
function detach(){backend.unsubs.forEach(u=>{try{u()}catch(e){}});backend.unsubs=[];backend.col=null}
async function attach(col,skipCache){
  detach();
  try{
    const prof=await col.doc('profile').get();
    backend.col=col;backend.skipCache=skipCache;
    if(!prof.exists){ // primeira vez nesta conta: sobe o que já está neste aparelho
      await col.doc('profile').set(profileBody());
      for(const k of Object.keys(S.days))persistDay(k);
      for(const ex of Object.keys(PH))persistPhoto(ex);
      for(const k of Object.keys(DP))persistDayPhoto(k);
    }
  }catch(e){
    if(skipCache)return false;
    backend.col=col;backend.skipCache=false; // Firebase offline: segue com o cache dele
  }
  backend.unsubs.push(col.doc('profile').onSnapshot(s=>{
    if(!s.exists||(skipCache&&s.metadata.fromCache)||pending.profile||busy.profile)return;
    const d=JSON.parse(JSON.stringify(s.data()));
    if(Array.isArray(d.exercises))S.exercises=d.exercises;
    S.goal=d.goal||S.goal;S.v=d.v||1;S.nick=d.nick||'';S.workouts=d.workouts;S.schedule=d.schedule;S.onb=d.onb!==false;S.bio=d.bio||null;S.quiz=d.quiz||null;S.avatar=d.avatar||'';S.xpPublic=!!d.xpPublic;S.pause=d.pause||null;S.pauses=Array.isArray(d.pauses)?d.pauses:[];S.notif=d.notif||null;const gOld=JSON.stringify(S.groups||[]);S.groups=Array.isArray(d.groups)?d.groups:[];if(gOld!==JSON.stringify(S.groups)&&fb.uid)loadGroups();
    if(ensureDefaults())persistProfile();else saveLocal();
    render();
  },()=>{}));
  backend.unsubs.push(col.where('kind','==','dayphoto').onSnapshot(q=>{
    if(skipCache&&q.metadata.fromCache)return;
    const dp={};for(const doc of q.docs){const d=doc.data();if(d.date&&d.data)dp[d.date]=d.data}
    for(const k of Object.keys(DP)){const id='dayphoto-'+k;if(pending[id]||busy[id])dp[k]=DP[k]}
    DP=dp;saveDPLocal();if(!sheetRoot.innerHTML)render();
  },()=>{}));
  backend.unsubs.push(col.where('kind','==','photo').onSnapshot(q=>{
    if(skipCache&&q.metadata.fromCache)return;
    const ph={};for(const doc of q.docs){const d=doc.data();if(d.ex&&d.data)ph[d.ex]=d.data}
    for(const ex of Object.keys(PH)){const id='photo-'+ex;if(pending[id]||busy[id])ph[ex]=PH[ex]}
    PH=ph;savePhotosLocal();if(!sheetRoot.innerHTML)render();
  },()=>{}));
  backend.unsubs.push(col.where('kind','==','day').onSnapshot(q=>{
    if(skipCache&&q.metadata.fromCache)return;
    const days={};
    for(const doc of q.docs){const d=doc.data();days[d.date]={checked:!!d.checked,logs:JSON.parse(JSON.stringify(d.logs||[]))};if(d.w)days[d.date].w=d.w;if(Array.isArray(d.done))days[d.date].done=[...d.done];for(const f of ['start','end','dur'])if(d[f]!=null)days[d.date][f]=d[f];if(Array.isArray(d.acts))days[d.date].acts=JSON.parse(JSON.stringify(d.acts))}
    for(const k of Object.keys(S.days)){const id='day-'+k;if(pending[id]||busy[id])days[k]=S.days[k]}
    S.days=days;saveLocal();render();
  },()=>{}));
  return true;
}

};
const SPLITS={2:['fullA','fullB'],3:{ini:['fullA','fullB','fullC'],exp:['supA','infA','fullC']},4:['supA','infA','supB','infB'],5:['supA','infA','push','pull','legs'],6:['push','pull','legs','push','pull','legs']};
const DAYMAP={2:[1,4],3:[1,3,5],4:[1,2,4,5],5:[1,2,3,5,6],6:[1,2,3,4,5,6]};

const PARAMS={
  hipertrofia:{m:[3,8,12,2],a:[3,10,15,1.5]},
  forca:{m:[4,4,6,3],a:[3,6,10,2]},
  emagrecer:{m:[3,10,12,1.5],a:[3,12,15,1]}
};
const bmiOf=(w,h)=>w/((h/100)**2);
const bmiClass=b=>b<18.5?'abaixo do peso':b<25?'faixa saudável':b<30?'sobrepeso':'obesidade';
function genPlan(o){
  const bmi=bmiOf(o.w,o.h),age=o.age||30,heavy=bmi>=30||age>=60,P=JSON.parse(JSON.stringify(PARAMS[o.goal]));
  if(age<18&&o.goal==='forca')P.m=[3,6,10,2.5];
  if(age>=40&&age<60){P.m[3]+=0.5;P.a[3]+=0.5}
  if(age>=60){P.m=[P.m[0],10,15,2];P.a=[P.a[0],10,15,1.5]}
  let keys=SPLITS[o.days];if(!Array.isArray(keys))keys=keys[o.level];
  // IMC alto: troca exercícios de mais impacto por versões com apoio
  const swap=heavy?{'agachamento':'leg-press','bulgaro':'abdutora',...(age>=60?{'stiff':'mesa-flexora'}:{})}:{};
  const ensure=id=>{let e=resolveEx(id);if(!e){e={...CAT[id]};S.exercises.push(e)}return e.id};
  const made={},workouts=[];
  for(const key of keys){
    if(made[key])continue;
    const T=TEMPL[key];let slots=T.slots.slice();
    if(o.goal==='forca')slots=slots.slice(0,5);
    const used=new Set(),items=[];
    for(let [id,t] of slots){
      if(swap[id])id=swap[id];
      if(used.has(id))id=t==='m'?'extensora':'panturrilha-sentado';
      if(used.has(id))continue;
      used.add(id);
      if(t==='i'){items.push({ex:ensure(id),sets:3,rmin:30,rmax:45,rest:1});continue}
      let [sets,rmin,rmax,rest]=P[t];
      if(o.level==='ini')sets=Math.max(2,sets-(t==='a'||o.goal==='forca'?1:0));
      items.push({ex:ensure(id),sets,rmin,rmax,rest});
    }
    const cardio=o.goal==='emagrecer'?(bmi>=25?25:20):(o.goal==='hipertrofia'&&bmi>=27?15:0);
    if(cardio)items.push({ex:ensure(heavy?'bike':'esteira'),mins:cardio});
    if(age>=40)items.push({ex:ensure('mobilidade'),mins:10});
    made[key]='p-'+key;workouts.push({id:'p-'+key,t:T.t,items});
  }
  const sched={'0':null,'1':null,'2':null,'3':null,'4':null,'5':null,'6':null};
  DAYMAP[o.days].forEach((d,i)=>{sched[String(d)]=made[keys[i]]});
  return {workouts,sched};
}

const rest={end:0,total:0,iv:null,ctx:null,done:false};
function audioOn(){try{rest.ctx=rest.ctx||new (window.AudioContext||window.webkitAudioContext)();if(rest.ctx.state==='suspended')rest.ctx.resume()}catch(e){}}
function beep(){
  const c=rest.ctx;if(!c)return;
  [0,.28,.56].forEach(t=>{const o=c.createOscillator(),g=c.createGain();o.frequency.value=880;o.connect(g);g.connect(c.destination);
    g.gain.setValueAtTime(.0001,c.currentTime+t);g.gain.exponentialRampToValueAtTime(.35,c.currentTime+t+.02);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+t+.2);
    o.start(c.currentTime+t);o.stop(c.currentTime+t+.22)});
}
function startRest(sec){
  audioOn();rest.total=sec;rest.end=Date.now()+sec*1000;rest.done=false;
  const bar=document.getElementById('restBar');
  bar.className='restbar';bar.hidden=false;
  bar.innerHTML=`<div class="rtop"><span class="rl">Descanso</span><span class="rt num" id="restT"></span><button data-act="restAdd" data-n="-15">−15s</button><button data-act="restAdd" data-n="15">+15s</button><button data-act="restStop">Pular</button></div><span class="rp"><i id="restP"></i></span>`;
  clearInterval(rest.iv);rest.iv=setInterval(tickRest,250);tickRest();
}
function tickRest(){
  if(!rest.end||rest.done)return;
  const left=Math.max(0,Math.ceil((rest.end-Date.now())/1000));
  const t=document.getElementById('restT'),p=document.getElementById('restP');
  if(t)t.textContent=`${Math.floor(left/60)}:${pad(left%60)}`;
  if(p)p.style.width=`${Math.max(0,Math.min(100,(1-(rest.end-Date.now())/(rest.total*1000))*100))}%`;
  if(left<=0){
    rest.done=true;clearInterval(rest.iv);beep();try{navigator.vibrate&&navigator.vibrate([250,120,250])}catch(e){}
    const bar=document.getElementById('restBar');bar.className='restbar fin';
    bar.innerHTML=`<div class="rtop"><span class="rl">Descanso acabou! Bora pra próxima série</span><button data-act="restStop">OK</button></div>`;
    setTimeout(()=>{if(rest.done)stopRest()},8000);
  }
}
function stopRest(){clearInterval(rest.iv);rest.end=0;rest.done=false;const bar=document.getElementById('restBar');bar.hidden=true;bar.innerHTML=''}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&rest.end&&!rest.done)tickRest()});

const newCode=()=>Array.from({length:6},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random()*32)]).join('');
async function addGroup(gid){
  if(!S.groups.includes(gid))S.groups.push(gid);
  persistProfile();G.sel=gid;G.view='rank';
  await pushStats();await loadGroups();ui.tab='amigos';render();
}
async function createGroup(name){
  const fs=fb.fs,uid=fb.uid,ref=fs.collection('groups').doc();
  let code=newCode();
  for(let i=0;i<3;i++){const ex=await fs.collection('codes').doc(code).get().catch(()=>null);if(!ex||!ex.exists)break;code=newCode()}
  await ref.set({name,code,owner:uid,members:[uid],createdAt:Date.now()});
  await fs.collection('codes').doc(code).set({gid:ref.id,name,owner:uid});
  await addGroup(ref.id);
}
async function joinGroup(code){
  const c=code.trim().toUpperCase();
  const s=await fb.fs.collection('codes').doc(c).get();
  if(!s.exists){toast('Não achei esse código. Confira as letras e tente de novo.');return false}
  const {gid,name}=s.data();
  if(!S.groups.includes(gid))await fb.fs.collection('groups').doc(gid).update({members:firebase.firestore.FieldValue.arrayUnion(fb.uid)});
  await addGroup(gid);toast(`Você entrou no grupo ${name}!`);return true;
}
async function leaveGroup(gid){
  const ref=fb.fs.collection('groups').doc(gid);
  try{await ref.collection('members').doc(fb.uid).delete()}catch(e){}
  await ref.update({members:firebase.firestore.FieldValue.arrayRemove(fb.uid)});
  S.groups=S.groups.filter(g=>g!==gid);delete G.list[gid];persistProfile();
  G.sel=S.groups.find(g=>G.list[g])||null;subGroup();render();
}
async function deleteGroup(gid){
  const g=G.list[gid];
  await fb.fs.collection('groups').doc(gid).delete();
  if(g&&g.code)try{await fb.fs.collection('codes').doc(g.code).delete()}catch(e){}
  S.groups=S.groups.filter(x=>x!==gid);delete G.list[gid];persistProfile();
  G.sel=S.groups.find(x=>G.list[x])||null;subGroup();render();
}
async function smallPhoto(src){
  const img=await new Promise((ok,err)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=err;i.src=src});
  const sc=Math.min(1,640/Math.max(img.naturalWidth,img.naturalHeight));
  const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*sc);c.height=Math.round(img.naturalHeight*sc);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);return c.toDataURL('image/jpeg',0.7);
}
async function postToGroups(k){
  if(!fb.uid||!S.groups.length){toast('Entre num grupo na aba Amigos pra postar no feed.');return}
  const d=sessionData(k),img=DP[k]?await smallPhoto(DP[k]):'';
  const post={uid:fb.uid,name:displayName()||'Sem nome',photo:ui.photo||'',date:k,title:d.title,groups:d.groups,dur:d.dur||0,volume:Math.round(d.volume),nEx:d.rows.length,img,createdAt:Date.now()};
  let ok=0;
  for(const gid of S.groups){try{await fb.fs.collection('groups').doc(gid).collection('posts').doc(fb.uid+'_'+k).set(post,{merge:true});ok++}catch(e){}}
  toast(ok?'Treino postado no feed!':'Não deu pra postar agora. Tente de novo.');
}

  if(ui.sync!=='google')return head+`<div class="empty">Crie um grupo com suas amigas, veja o ranking da semana e os treinos de todo mundo no feed.</div>${fb.ready?`<button class="gbtn" data-act="signin">${GICON}Entrar com Google pra começar</button>`:''}`;
  if(!S.groups.length)return head+`<div class="empty">Você ainda não está em nenhum grupo. Crie um e mande o convite pras amigas, ou entre com o código que alguém te mandou.</div>
    <button class="primary" data-act="gNew">Criar um grupo</button><button class="ghost" data-act="gJoin">Entrar com código de convite</button>`;
  const ids=S.groups.filter(g=>G.list[g]);
  if(!ids.length)return head+`<div class="empty">Carregando seus grupos…</div>`;

  const chips=`<div class="chips">${ids.map(id=>`<button class="chip gchip ${id===g.id?'on':''}" data-act="gSel" data-id="${id}">${esc(G.list[id].name)}</button>`).join('')}<button class="chip gchip" data-act="gMore" aria-label="Criar ou entrar em outro grupo">+ Grupo</button></div>`;
  const n=(g.members||[]).length;
  const top=`<div class="ghead"><div class="gh1"><h2>${esc(g.name)}</h2><div class="muted" style="font-size:.88rem">${n} ${n===1?'pessoa':'pessoas'} · código <b class="num">${esc(g.code)}</b></div></div><button class="sm solid" data-act="gInvite">Convidar</button></div>`;
  const seg=`<div class="seg"><button class="${G.view==='rank'?'on':''}" data-act="gView" data-v="rank">Ranking da semana</button><button class="${G.view==='feed'?'on':''}" data-act="gView" data-v="feed">Feed</button></div>`;
  let body='';
  if(G.view==='rank'){
    const rows=G.members.map(m=>({...m,d:m.weekKey===ws?m.weekDays:0,v:m.weekKey===ws?m.weekVol:0})).sort((a,b)=>b.d-a.d||(b.streak||0)-(a.streak||0)||(b.total||0)-(a.total||0));
    const medal=['🥇','🥈','🥉'];
    body=rows.length?`<div class="list rank">${rows.map((m,i)=>`<div class="item ${m.id===me?'me':''}" data-act="friend" data-id="${m.id}" role="button" tabindex="0"><span class="pos">${m.d&&i<3?medal[i]:i+1}</span>${frameAv(m.lv||1,m.photo,m.name,'sm')}<div class="main"><div class="name">${esc(m.name)}${m.id===me?' <span class="muted">(você)</span>':''}</div><div class="sub num">${m.streak?`${m.streak} ${m.streak===1?'semana seguida':'semanas seguidas'}`:'começando agora'}</div></div><span class="days num"><b>${m.d}</b><small>${m.d===1?'dia':'dias'}</small></span></div>`).join('')}</div>
      <p class="hint" style="margin:0">Conta os dias com presença marcada desta semana (domingo a sábado). Empate: quem está há mais semanas seguidas treinando. Toque em alguém pra ver o perfil.</p>`
      :`<div class="empty">O ranking aparece quando as pessoas do grupo abrirem o app.</div>`;
  }else{
    body=G.posts.length?G.posts.map(p=>{
      const likes=p.likes||[],liked=likes.includes(me);
      const stats=[p.dur?`${p.dur} min`:'',p.nEx?`${p.nEx} ${p.nEx===1?'exercício':'exercícios'}`:''].filter(Boolean).join(' · ');
      return `<article class="post"><div class="phd">${avHtml(p.photo,p.name,'av2')}<div class="main"><div class="name">${esc(p.name)}</div><div class="sub">${esc(whenTxt(p.date))}</div></div></div>
        <div class="ptitle">${esc(p.title)}</div>${(p.groups||[]).length?pills(p.groups):''}
        ${p.img?`<img class="pimg" src="${p.img}" alt="Foto do treino de ${esc(p.name)}" loading="lazy">`:''}
        ${stats?`<div class="pstats num">${stats}</div>`:''}
        <div class="pact"><button class="fire ${liked?'on':''}" data-act="gLike" data-id="${p.id}" aria-pressed="${liked}">🔥 ${likes.length||''}</button>${p.uid===me?`<button class="link" data-act="gDelPost" data-id="${p.id}">Apagar</button>`:''}</div></article>`;
    }).join(''):`<div class="empty">Ninguém postou ainda. No fim do treino, toque em <b>Postar no feed dos grupos</b>.</div>`;
  }
  const foot=g.owner===me?`<button class="ghost danger" data-act="gDelete">Apagar este grupo</button>`:`<button class="ghost danger" data-act="gLeave">Sair deste grupo</button>`;
  return head+chips+top+seg+body+foot;
}

async function shareInvite(){
  const g=G.list[G.sel];if(!g)return;
  const url=location.origin+location.pathname+'?convite='+g.code;
  const text=`Bora treinar comigo no KOVA! Entra no grupo "${g.name}" com o código ${g.code}: ${url}`;
  try{if(navigator.share){await navigator.share({text});return}}catch(e){if(e&&e.name==='AbortError')return}
  try{await navigator.clipboard.writeText(text);toast('Convite copiado! Cole no WhatsApp.')}catch(e){toast(`Código do grupo: ${g.code}`)}
}

document.addEventListener('click',async ev=>{
  const b=ev.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act;
  try{
  switch(a){
    case 'step':if((b.dataset.t||'').startsWith('ob'))setTimeout(()=>{readOb();const h=document.getElementById('obBmi');if(h)h.textContent=bmiHint()},0);return;
    case 'redoPlan':ui.redo=true;obInit();render();window.scrollTo(0,0);return;
    case 'obCancel':ui.redo=false;ui.ob=null;render();return;
    case 'obGoal':readOb();ui.ob.goal=b.dataset.g;render();return;
    case 'obDays':readOb();ui.ob.days=+b.dataset.n;render();return;
    case 'obLevel':readOb();ui.ob.level=b.dataset.l;render();return;
    case 'obCreate':{
      readOb();const o=ui.ob,plan=genPlan(o);
      S.workouts=plan.workouts;S.schedule=plan.sched;S.goal=o.days;S.bio={...(S.bio||{}),w:o.w,h:o.h,age:o.age,goal:o.goal,days:o.days,level:o.level};
      obDone(`Plano de ${GOALS[o.goal].n.toLowerCase()} criado!`);return;
    }
    case 'obZero':
      if(ui.redo&&!b.classList.contains('armed')){b.classList.add('armed');b.textContent='Toque de novo: isso apaga seus treinos atuais';return}
      readOb();S.workouts=[];S.schedule={'0':null,'1':null,'2':null,'3':null,'4':null,'5':null,'6':null};S.bio={...(S.bio||{}),w:ui.ob.w,h:ui.ob.h,goal:'zero'};
      obDone('Pronto! Crie seu primeiro treino em "+ Criar treino".');return;
    case 'restGo':startRest(+b.dataset.s||90);return;
    case 'restAdd':rest.end+=(+b.dataset.n)*1000;rest.total=Math.max(rest.total+(+b.dataset.n),5);tickRest();return;
    case 'restStop':stopRest();return;
    case 'evoTab':ui.evo=b.dataset.v;render();return;
    case 'gSel':G.sel=b.dataset.id;subGroup();render();return;
    case 'gView':G.view=b.dataset.v;render();return;
    case 'gNew':return sheetNewGroup();
    case 'gJoin':return sheetJoin('');
    case 'gMore':openSheet(`<div class="sheethead"><div><h2>Grupos</h2></div>${closeBtn()}</div><button class="primary" data-act="gNew">Criar um grupo novo</button><button class="ghost" data-act="gJoin">Entrar com código de convite</button>`);return;
    case 'gInvite':return shareInvite();
    case 'gCreateGo':{
      const name=document.getElementById('gName').value.trim();if(!name){toast('Dê um nome pro grupo');return}
      b.disabled=true;b.textContent='Criando…';await createGroup(name.slice(0,40));closeSheet();ui.tab='amigos';render();toast('Grupo criado! Agora convide as amigas.');return;
    }
    case 'gJoinGo':{
      const code=document.getElementById('gCode').value;if(code.trim().length<6){toast('O código tem 6 letras e números');return}
      b.disabled=true;b.textContent='Entrando…';const ok=await joinGroup(code);if(ok)closeSheet();else{b.disabled=false;b.textContent='Entrar no grupo'}return;
    }
    case 'gLike':{
      const p=G.posts.find(x=>x.id===b.dataset.id);if(!p)return;const liked=(p.likes||[]).includes(fb.uid),FV=firebase.firestore.FieldValue;
      await fb.fs.collection('groups').doc(G.sel).collection('posts').doc(p.id).update({likes:liked?FV.arrayRemove(fb.uid):FV.arrayUnion(fb.uid)});return;
    }
    case 'gDelPost':
      if(!b.classList.contains('armed')){b.classList.add('armed');b.textContent='Toque de novo pra apagar';return}
      await fb.fs.collection('groups').doc(G.sel).collection('posts').doc(b.dataset.id).delete();toast('Post apagado');return;
    case 'gLeave':
      if(!b.classList.contains('armed')){b.classList.add('armed');b.textContent='Toque de novo pra sair do grupo';return}
      await leaveGroup(G.sel);toast('Você saiu do grupo');return;
    case 'gDelete':
      if(!b.classList.contains('armed')){b.classList.add('armed');b.textContent='Toque de novo: apaga o grupo pra todo mundo';return}
      await deleteGroup(G.sel);toast('Grupo apagado');return;
    case 'gPost':b.disabled=true;b.textContent='Postando…';await postToGroups(b.dataset.k);b.textContent='Postado no feed ✓';return;
  }
  }catch(e){toast('Algo deu errado. Confira sua internet e tente de novo.');console.error(e)}
});

function actData(k,id){
  const a=((S.days[k]||{}).acts||[]).find(x=>x.id===id);if(!a)return sessionData(k);
  const ws=weekStart(k),week=[0,1,2,3,4,5,6].map(i=>!!S.days[addDays(ws,i)]?.checked);
  const stats=[['TEMPO',a.min?String(a.min):'—',a.min?'min':'']];
  if(a.km)stats.push(['DISTÂNCIA',fmt(a.km),'km']);
  return {k,title:actName(a),groups:[],rows:[],volume:0,dur:a.min,week,weekCount:week.filter(Boolean).length,stats};

// Níveis: cada nível pede ~15% mais XP que o anterior. Área do corpo sobe a cada 400 XP.
const needFor=L=>Math.round(150*Math.pow(1.15,L-1)/10)*10;
const tierOf=L=>L>=20?'Diamante':L>=12?'Ouro':L>=6?'Prata':'Bronze';
const AREA_STEP=400;
const areaLv=xp=>({l:Math.floor(xp/AREA_STEP)+1,cur:xp%AREA_STEP});
function planSetsFor(exId){for(const w of S.workouts||[]){const it=w.items.find(i=>i.ex===exId);if(it&&it.sets)return it.sets}return 3}
function inPause(k){
  if(S.pause&&k>=S.pause&&k<=addDays(S.pause,30))return true;
  return (S.pauses||[]).some(p=>k>=p.from&&k<=p.to);
}
const isActiveDay=k=>{const d=S.days[k];return !!d&&!!(d.checked||(d.logs||[]).length||(d.acts||[]).length||(d.done||[]).length)};
// XP calculado do histórico: +10 por série na área do exercício, +20 por cardio/atividade,
// +25 por recorde, +50 por treino completo, bônus de retorno e de boas-vindas, perda leve por inatividade.
function computeXP(){
  const q=S.quiz,L0=q?q.startLv:1,qd=q?q.date:null;
  const keys=sortedKeys(),areas={},gain={},bestW={};let prs=0;
  for(const k of keys){
    const d=S.days[k];let g=0;const dayMax={};
    for(const l of d.logs||[]){
      const e=exById(l.ex),a=e?e.group:null,x=l.min!=null?20:10*(l.s||1);
      if(a)areas[a]=(areas[a]||0)+x;g+=x;
      if(l.w!=null)dayMax[l.ex]=Math.max(dayMax[l.ex]||0,l.w);
    }
    for(const ex in dayMax){if(bestW[ex]!=null&&dayMax[ex]>bestW[ex]){g+=25;prs++}bestW[ex]=Math.max(bestW[ex]||0,dayMax[ex])}
    for(const ex of d.done||[]){
      if((d.logs||[]).some(l=>l.ex===ex))continue;
      const e=exById(ex);if(!e)continue;
      const x=kindOf(e)==='tempo'?20:10*planSetsFor(ex);areas[e.group]=(areas[e.group]||0)+x;g+=x;
    }
    const w=workoutFor(k);if(w&&w.items.length&&w.items.every(it=>isDone(k,it.ex)))g+=50;
    for(const a of d.acts||[]){const gr=actInfo(a.type).g;areas[gr]=(areas[gr]||0)+20;g+=20}
    gain[k]=g;
  }
  let level=L0,into=0,total=0,idle=0,lossWin=0,lost=0,todayGain=0;const gains={};
  const t=today();let start=keys.find(isActiveDay)||t;if(qd&&qd<start)start=qd;
  for(let k=start;k<=t;k=addDays(k,1)){
    if(isActiveDay(k)){
      let g=gain[k]||0;
      if(qd&&k>=qd&&idle>=7&&!inPause(k))g+=50;
      if(q&&L0===1&&qd&&k>=qd&&k<addDays(qd,28))g=Math.round(g*1.5);
      into+=g;total+=g;while(into>=needFor(level)){into-=needFor(level);level++}
      idle=0;lossWin=0;lost=0;gains[k]=g;if(k===t)todayGain=g;
    }else{
      idle++;
      if(qd&&k>=qd&&idle>7&&!inPause(k)){
        if((idle-8)%7===0)lossWin=0;
        if(lossWin<35){const l=Math.min(5,into);into-=l;lossWin+=5;lost+=l}
      }
    }
  }
  return {level,into,need:needFor(level),total,areas,prs,idle,lost,todayGain,gains,tier:tierOf(level)};
}
let _xp=null;const XP=()=>_xp||(_xp=computeXP());

/* ================= Cortador de foto (arrastar, zoom e pinça) ================= */
function pickFile(cb){const i=document.createElement('input');i.type='file';i.accept='image/*';i.hidden=true;document.body.appendChild(i);i.addEventListener('change',()=>{const f=i.files&&i.files[0];i.remove();if(f)cb(f)});i.click()}
function openCropper(file,aspect,circle,title,outW,done){
  const url=URL.createObjectURL(file),img=new Image();
  img.onerror=()=>{URL.revokeObjectURL(url);toast('Não consegui abrir essa imagem. Tente outra foto.')};
  img.onload=()=>{
    const ov=document.createElement('div');ov.className='crop';
    ov.innerHTML=`<div class="ct"><button data-c="cancel">Cancelar</button><b>${title}</b><button class="ok" data-c="ok">Usar foto</button></div>
      <div class="stage"><div class="box ${circle?'circle':''}"><img alt=""><div class="grid"></div></div></div>
      <div class="zoom"><span>−</span><input type="range" min="1" max="4" step="0.01" value="1" aria-label="Zoom"><span>+</span></div>
      <p class="chint">Arraste pra posicionar · use o controle ou dois dedos pro zoom</p>`;
    document.body.appendChild(ov);
    const box=ov.querySelector('.box'),im=ov.querySelector('img'),rng=ov.querySelector('input');
    const W=Math.min(window.innerWidth-32,420),H=Math.round(W/aspect),maxH=window.innerHeight*0.55,k0=H>maxH?maxH/H:1;
    const BW=Math.round(W*k0),BH=Math.round(H*k0);
    box.style.width=BW+'px';box.style.height=BH+'px';im.src=url;
    const nw=img.naturalWidth,nh=img.naturalHeight,base=Math.max(BW/nw,BH/nh);
    let z=1,s=base,tx=(BW-nw*s)/2,ty=(BH-nh*s)/2;
    const draw=()=>{tx=Math.min(0,Math.max(BW-nw*s,tx));ty=Math.min(0,Math.max(BH-nh*s,ty));im.style.width=nw+'px';im.style.height=nh+'px';im.style.transform=`translate(${tx}px,${ty}px) scale(${s})`};
    const setZoom=(nz,cx=BW/2,cy=BH/2)=>{nz=Math.min(4,Math.max(1,nz));const ns=base*nz;tx=cx-(cx-tx)*ns/s;ty=cy-(cy-ty)*ns/s;s=ns;z=nz;rng.value=z;draw()};
    draw();
    rng.addEventListener('input',()=>setZoom(+rng.value));
    const pts=new Map();let last=null,lastD=0;
    box.addEventListener('pointerdown',e=>{box.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});last={x:e.clientX,y:e.clientY};if(pts.size===2){const [a,b]=[...pts.values()];lastD=Math.hypot(a.x-b.x,a.y-b.y)}});
    box.addEventListener('pointermove',e=>{
      if(!pts.has(e.pointerId))return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
      if(pts.size===2){const [a,b]=[...pts.values()],d=Math.hypot(a.x-b.x,a.y-b.y),r=box.getBoundingClientRect();if(lastD)setZoom(z*d/lastD,(a.x+b.x)/2-r.left,(a.y+b.y)/2-r.top);lastD=d;return}
      tx+=e.clientX-last.x;ty+=e.clientY-last.y;last={x:e.clientX,y:e.clientY};draw();
    });
    const up=e=>{pts.delete(e.pointerId);lastD=0;const v=[...pts.values()][0];if(v)last={...v}};
    box.addEventListener('pointerup',up);box.addEventListener('pointercancel',up);
    box.addEventListener('wheel',e=>{e.preventDefault();const r=box.getBoundingClientRect();setZoom(z*(e.deltaY<0?1.08:1/1.08),e.clientX-r.left,e.clientY-r.top)},{passive:false});
    ov.addEventListener('click',e=>{
      const c=e.target.closest('[data-c]');if(!c)return;
      if(c.dataset.c==='ok'){
        const OH=Math.round(outW/aspect),cv=document.createElement('canvas');cv.width=outW;cv.height=OH;
        cv.getContext('2d').drawImage(img,-tx/s,-ty/s,BW/s,BH/s,0,0,outW,OH);
        done(cv.toDataURL('image/jpeg',.8));
      }
      ov.remove();URL.revokeObjectURL(url);
    });
  };
  img.src=url;
}

  if(X.idle>=5&&X.idle<7)return `<section class="card warn"><div class="wt"><b>Bora voltar?</b><span class="xpchip">${7-X.idle} ${7-X.idle===1?'dia':'dias'}</span></div><span class="muted" style="font-size:.84rem">Faz ${X.idle} dias sem treino. Seu XP começa a cair em ${7-X.idle} ${7-X.idle===1?'dia':'dias'}. Qualquer atividade conta.</span></section>`;

}
function todayCard(k,w,done2){

const MAIN_AREAS=['Glúteos','Quadríceps','Posterior','Costas','Peito','Ombros','Bíceps','Tríceps','Abdômen','Panturrilha'];
function xpBody(areas,mine){
  const all=Object.entries(areas).filter(([,x])=>x>0).sort((a,b)=>b[1]-a[1]);
  if(!all.length)return `<div class="empty">${mine?'Registre séries e marque exercícios feitos pra ganhar XP em cada área do corpo.':'Ainda sem XP por aqui.'}</div>`;
  const shades=['var(--accent)','var(--accent-2)','var(--accent-3)','var(--accent-4)'];
  const top=all.slice(0,4);
  const rings=top.map(([n,xp],i)=>{const r=64-i*14,C=2*Math.PI*r,L=areaLv(xp);return `<circle cx="75" cy="75" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="10"/><circle cx="75" cy="75" r="${r}" fill="none" stroke="${shades[i]}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-L.cur/AREA_STEP)}" transform="rotate(-90 75 75)"/>`}).join('');
  const main=MAIN_AREAS.map(n=>[n,areas[n]||0]);
  const max=Math.max(1,...main.map(a=>a[1]));
  const bars=list=>list.map(([n,xp])=>{const L=areaLv(xp),hh=xp?Math.max(18,Math.round(xp/max*100)):0;return `<div class="xbar"><span class="lvl num">Nv ${L.l}</span><div class="tr">${xp?`<div class="fl num" style="height:${hh}%">${xp>=1000?(xp/1000).toFixed(1).replace('.',',')+'k':xp}</div>`:''}</div><small>${n}</small></div>`}).join('');
  const extra=['Cardio','Funcional','Alongamento'].filter(n=>areas[n]).map(n=>`${n} ${areas[n].toLocaleString('pt-BR')} XP`).join(' · ');
  return `<section class="card rings"><svg viewBox="0 0 150 150" aria-label="Progresso das áreas mais treinadas até o próximo nível">${rings}</svg>
    <div class="legend">${top.map(([n,xp],i)=>{const L=areaLv(xp);return `<div><i style="background:${shades[i]}">${L.l}</i><span style="min-width:0"><b>${n}</b><span class="num">${L.cur} / ${AREA_STEP} XP</span></span></div>`}).join('')}</div></section>
  <section class="card" style="padding:18px"><div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px"><h3 style="color:var(--fg);font-size:1rem;letter-spacing:0;text-transform:none;font-weight:700">Todas as áreas</h3><span class="eyebrow">XP total</span></div>
    <div class="xbars">${bars(main.slice(0,5))}</div><div class="xbars" style="margin-top:16px">${bars(main.slice(5))}</div>
    ${extra?`<p class="muted num" style="font-size:.8rem;margin-top:14px">${extra}</p>`:''}</section>`;
}
function viewXP(){
  const t=ui.xpTab||'xp';
  const seg=`<div class="seg"><button class="${t==='xp'?'on':''}" data-act="xpTab" data-v="xp">XP</button><button class="${t==='freq'?'on':''}" data-act="xpTab" data-v="freq">Frequência</button><button class="${t==='cargas'?'on':''}" data-act="xpTab" data-v="cargas">Cargas</button></div>`;

document.addEventListener('click',ev=>{

  const a=b.dataset.act;

  if(a==='qAns'){ui.q.ans[+b.dataset.i]=+b.dataset.a;const y=window.scrollY;render();window.scrollTo(0,y);return}
  if(a==='qStep'){const k=b.dataset.k,n=+b.dataset.n,lim={age:[12,90],w:[30,250],h:[120,220]}[k];ui.q[k]=Math.min(lim[1],Math.max(lim[0],ui.q[k]+n));const y=window.scrollY;render();window.scrollTo(0,y);return}
  if(a==='qReview'){if(!ui.q.ans.every(v=>v!=null))return;ui.q.step='confirm';render();window.scrollTo(0,0);return}
  if(a==='qEdit'){ui.q.step='ask';render();window.scrollTo(0,0);return}
  if(a==='qConfirm'){
    const q=ui.q,L=quizLevel(q.ans);
    S.quiz={ans:q.ans,age:q.age,w:q.w,h:q.h,startLv:L,date:today(),at:Date.now()};

    toast(`Você começa no Nv ${L} · ${tierOf(L)}!`);return;
  }
  if(a==='goDay'){ui.date=b.dataset.k;ui.group=null;render();return}
  if(a==='xpTab'){ui.xpTab=b.dataset.v;render();return}
  if(a==='xpPublic'){S.xpPublic=!S.xpPublic;persistProfile();scheduleStats();render();toast(S.xpPublic?'Seu XP agora aparece pros amigos dos grupos':'Seu XP agora é só seu');return}
  if(a==='pause'){
    const on=!!(S.pause&&today()<=addDays(S.pause,30));
    if(on){S.pauses=[...(S.pauses||[]),{from:S.pause,to:today()}];S.pause=null;toast('Modo pausa desligado. Bom treino!')}
    else{S.pause=today();toast('XP congelado por até 30 dias')}
    _xp=null;persistProfile();render();return;
  }
  if(a==='pickAvatar'){pickFile(f=>openCropper(f,1,true,'Foto de perfil',320,d=>{S.avatar=d;persistProfile();scheduleStats();render();toast('Foto de perfil atualizada')}));return}
  if(a==='bodyEdit')return sheetBody();
  if(a==='notifOn'){closeSheet();enablePush();return}
  if(a==='notifOff'){disablePush();return}
  if(a==='notifPref'){const k=b.dataset.k,P=notifPrefs();P[k]=!P[k];S.notif={...(S.notif||{}),prefs:P};persistProfile();const y=window.scrollY;render();window.scrollTo(0,y);return}
  if(a==='bodySave'){const v=Math.min(250,Math.max(30,readNum('bodyW')));S.bio={...(S.bio||{}),w:v};persistProfile();closeSheet();render();toast('Peso atualizado');return}
  if(a==='friend'){if(b.dataset.id===fb.uid){ui.tab='perfil';render();window.scrollTo(0,0);return}ui.friend=b.dataset.id;render();window.scrollTo(0,0);return}
  if(a==='friendBack'){ui.friend=null;render();window.scrollTo(0,0);return}
});

async function shrinkPhoto(file){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((ok,err)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=err;i.src=url});
    const side=Math.min(img.naturalWidth,img.naturalHeight),size=Math.min(360,side);
    const c=document.createElement('canvas');c.width=c.height=size;

}

function viewFreq(){
  const t=today(),ws=weekStart(t);

  while(weekCount(w)>0){streak++;w=addDays(w,-7)}
  const first=new Date(y,mo,1).getDay(),dim=new Date(y,mo+1,0).getDate();
  let cells='';for(let i=0;i<first;i++)cells+='<div class="day blank"></div>';
  for(let d=1;d<=dim;d++){
    const k=prefix+pad(d),on=S.days[k]?.checked,fut=k>t;

    <p class="hint">Os pontinhos mostram as cores dos grupos treinados. Toque num dia para marcar ou desmarcar presença. Dias com foto abrem a foto. O anel pontilhado marca outras atividades fora da academia.</p>

  ${(()=>{const acts=Object.keys(S.days).filter(k=>k.startsWith(prefix)).flatMap(k=>S.days[k].acts||[]);if(!acts.length)return '';
    const mins=acts.reduce((s,a)=>s+(a.min||0),0),byType={};for(const a of acts){const n=actName(a);byType[n]=(byType[n]||0)+1}

function niceStep(r){if(!(r>0))return 1;const e=Math.pow(10,Math.floor(Math.log10(r))),f=r/e;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*e}
function chart(pts){
  const W=340,H=190,pl=36,pr=16,pt=22,pb=26;
  let lo=Math.min(...pts.map(p=>p.w)),hi=Math.max(...pts.map(p=>p.w));
  if(hi-lo<4){lo=Math.max(0,lo-5);hi=hi+5}
  const st=niceStep((hi-lo)/3);lo=Math.floor(lo/st)*st;hi=Math.ceil(hi/st)*st;
  const x=i=>pts.length===1?(pl+W-pr)/2:pl+i*(W-pl-pr)/(pts.length-1);
  const y=v=>pt+(hi-v)/(hi-lo)*(H-pt-pb);
  let g='';for(let v=lo;v<=hi+1e-9;v+=st)g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end">${fmt(v)}</text>`;
  const line=pts.map((p,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(p.w).toFixed(1)}`).join('');
  const area=`${line}L${x(pts.length-1).toFixed(1)},${H-pb}L${x(0).toFixed(1)},${H-pb}Z`;
  const L=pts.length-1;
  const dots=pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.w)}" r="${i===L?5:3}" fill="${i===L?'var(--gc)':'var(--surface)'}" stroke="var(--gc)" stroke-width="2"/>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Carga máxima por treino">
    ${g}
    ${pts.length>1?`<path d="${area}" fill="var(--gc)" opacity=".13"/><path d="${line}" fill="none" stroke="var(--gc)" stroke-width="2.5" stroke-linejoin="round"/>`:''}
    ${dots}
    <text x="${Math.min(x(L)+(pts.length===1?0:4),W-pr)}" y="${y(pts[L].w)-10}" text-anchor="${pts.length===1?'middle':'end'}" style="fill:var(--fg);font-weight:600;font-size:12px">${fmt(pts[L].w)} kg</text>
    <text x="${x(0)}" y="${H-6}" text-anchor="${pts.length===1?'middle':'start'}">${ddmm(pts[0].k)}</text>
    ${pts.length>1?`<text x="${x(L)}" y="${H-6}" text-anchor="end">${ddmm(pts[L].k)}</text>`:''}
  </svg>`;
}
